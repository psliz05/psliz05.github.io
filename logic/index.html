<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Logic</title>
<meta name="description" content="Three daily logic puzzles by Patrick Sliz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a single printed spec sheet. Hard rules, square corners, one signal color for errors. Single light theme by design. */
  :root {
    --paper: #e6e6e1;
    --plate: #f3f3ef;
    --ink: #141414;
    --steel: #66665f;
    --hair: #b9b9b2;
    --given: #d6d6cf;
    --signal: #ff4a00;
    --tone-0: #f3f3ef;
    --tone-1: #e2e2dc;
    --tone-2: #d2d2ca;
    --tone-3: #eaeae5;
    --f-sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; border-radius: 0; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  .sheet {
    max-width: 520px; margin: 0 auto;
    padding-block: 20px 36px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 16px;
  }

  .mast { border-top: 6px solid var(--ink); border-bottom: 2px solid var(--ink); padding-block: 8px 10px; display: grid; grid-template-columns: 1fr auto; row-gap: 2px; align-items: end; }
  .mast h1 { margin: 0; font: 800 34px/0.95 var(--f-sans); font-stretch: 70%; text-transform: uppercase; letter-spacing: -0.01em; }
  .mast .ids { display: flex; flex-direction: column; align-items: flex-end; font: 500 12px/1.4 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink); }
  .tab { appearance: none; background: var(--plate); border: 0; border-left: 2px solid var(--ink); padding: 8px 10px 9px; text-align: left; cursor: pointer; display: grid; gap: 1px; min-width: 0; }
  .tab:first-child { border-left: 0; }
  .tab .no { font: 500 11px var(--f-mono); color: var(--steel); }
  .tab .nm { font: 750 17px/1.1 var(--f-sans); font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.01em; }
  .tab .tm { font: 500 12px var(--f-mono); color: var(--steel); font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--plate); }
  .tab[aria-selected="true"] .no, .tab[aria-selected="true"] .tm { color: var(--hair); }
  .tab.done .tm::before { content: "■ "; }

  .meta { display: flex; justify-content: space-between; align-items: baseline; font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .meta .clock { font-size: 20px; font-weight: 700; letter-spacing: 0; font-variant-numeric: tabular-nums; }

  .board { position: relative; width: 100%; max-width: 440px; margin: 0 auto; display: grid; background: var(--plate); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .cell { appearance: none; border: 0; padding: 0; margin: 0; aspect-ratio: 1; display: grid; place-items: center; background: transparent; cursor: pointer; position: relative; min-width: 0; font: 700 clamp(18px, 6vw, 28px) var(--f-mono); }
  .cell:focus-visible, .tab:focus-visible, .ctl:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; z-index: 2; }
  .board.solved .cell { cursor: default; }
  .board.draggable { touch-action: none; }

  /* Sectors */
  .b-sectors { border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
  .b-sectors .cell { border-top: 1px solid var(--hair); border-left: 1px solid var(--hair); }
  .b-sectors .cell.bt { border-top: 3px solid var(--ink); }
  .b-sectors .cell.bl { border-left: 3px solid var(--ink); }
  .b-sectors .cell[data-v="x"]::after { content: "×"; font: 500 clamp(14px, 4.4vw, 20px) var(--f-mono); color: var(--steel); }
  .b-sectors .cell[data-v="q"]::after { content: ""; width: 44%; height: 44%; background: var(--ink); }
  .b-sectors .cell.bad[data-v="q"]::after { background: var(--signal); }

  /* Binary */
  .b-binary { border: 2px solid var(--ink); }
  .b-binary .cell { border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .b-binary .cell.r-end { border-right: 0; } .b-binary .cell.b-end { border-bottom: 0; }
  .b-binary .cell.given { background: var(--given); cursor: default; }
  .b-binary .cell.bad { color: var(--signal); }
  .joint { position: absolute; width: 18px; height: 18px; transform: translate(-50%, -50%); background: var(--plate); border: 1.5px solid var(--ink); display: grid; place-items: center; font: 700 12px/1 var(--f-mono); pointer-events: none; z-index: 1; }
  .joint.bad { border-color: var(--signal); color: var(--signal); }

  /* Weights */
  .b-weights { background: transparent; }
  .b-weights .lab { display: grid; place-items: center; font: 500 13px var(--f-mono); color: var(--steel); aspect-ratio: 1; min-width: 0; }
  .b-weights .clue { display: grid; place-items: center; font: 700 15px var(--f-mono); aspect-ratio: 1; min-width: 0; border: 2px solid transparent; }
  .b-weights .clue.ok { background: var(--ink); color: var(--plate); }
  .b-weights .clue.over { border-color: var(--signal); color: var(--signal); }
  .b-weights .cell { background: var(--plate); border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .b-weights .cell.l-edge { border-left: 2px solid var(--ink); } .b-weights .cell.r-edge { border-right: 2px solid var(--ink); }
  .b-weights .cell.t-edge { border-top: 2px solid var(--ink); } .b-weights .cell.b-edge { border-bottom: 2px solid var(--ink); }
  .b-weights .cell[data-v="f"]::after { content: ""; position: absolute; inset: 3px; background: var(--ink); }
  .b-weights .cell.given { background: var(--given); cursor: default; }
  .b-weights .cell[data-v="x"]::after { content: "×"; font: 500 clamp(14px, 4.4vw, 20px) var(--f-mono); color: var(--steel); }

  .solvedbar { background: var(--ink); color: var(--plate); font: 700 13px var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 9px 12px; display: flex; justify-content: space-between; max-width: 440px; width: 100%; margin: 0 auto; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0; max-width: 440px; width: 100%; margin: 0 auto; border: 2px solid var(--ink); }
  .ctl { appearance: none; background: var(--plate); border: 0; padding: 11px; font: 700 13px var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; }
  .ctl + .ctl { border-left: 2px solid var(--ink); }
  .ctl:hover:not(:disabled) { background: var(--ink); color: var(--plate); }
  .ctl:disabled { color: var(--hair); cursor: default; }

  .rules { max-width: 440px; width: 100%; margin: 0 auto; border-top: 1px solid var(--ink); padding-top: 10px; display: grid; gap: 6px; }
  .rules p { margin: 0; font-size: 14px; }
  .rules .taps { font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--steel); }

  .summary { border: 2px solid var(--ink); background: var(--plate); display: grid; }
  .summary pre { margin: 0; padding: 12px; font: 500 13px/1.6 var(--f-mono); white-space: pre; overflow-x: auto; }
  .summary .row { display: grid; grid-template-columns: 1fr auto; border-top: 2px solid var(--ink); align-items: stretch; }
  .summary .next { font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.04em; padding: 11px 12px; color: var(--steel); }
  .summary .ctl { border-left: 2px solid var(--ink); }
  .summary textarea { width: 100%; border: 0; border-top: 2px solid var(--ink); font: 13px/1.5 var(--f-mono); padding: 10px 12px; background: var(--paper); color: var(--ink); resize: none; }

  .foot { border-top: 2px solid var(--ink); padding-top: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .foot nav { display: flex; flex-wrap: wrap; gap: 14px; }
  .foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); }
  .foot a:hover { color: var(--signal); border-color: var(--signal); }
  .foot .mail { text-transform: none; }
  .bar { border-bottom: 2px solid var(--ink); background: var(--plate); }
  .bar .in { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar a { display: inline-block; padding: 11px 0; color: var(--ink); font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
  .bar a:hover { color: var(--signal); }

  /* views: puzzles / archive / leaderboard */
  .amark { display: flex; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--plate); padding: 8px 12px; font: 700 12px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: -16px; }
  .amark a { color: var(--plate); text-decoration: none; }
  .amark a:hover { color: var(--signal); }
  .views { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--ink); margin-bottom: -18px; }
  .views a { background: var(--plate); color: var(--ink); text-decoration: none; padding: 8px 10px; border-left: 2px solid var(--ink); font: 700 12px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: clip; }
  .views a:first-child { border-left: 0; }
  .views a[aria-current="page"] { background: var(--ink); color: var(--plate); }
  .views a:hover:not([aria-current]) { color: var(--signal); }
  .views a:focus-visible, .arow:focus-visible, .lbsent a:focus-visible, .amark a:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }

  .atable, .lbtable { border: 2px solid var(--ink); background: var(--plate); font: 500 12px var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .ahead, .arow { display: grid; grid-template-columns: 40px 1fr repeat(3, 62px); column-gap: 6px; padding: 7px 10px; }
  .ahead, .lbhead { color: var(--steel); border-bottom: 2px solid var(--ink); font-size: 11px; }
  .ahead .t, .arow .t { text-align: right; }
  .arow { color: var(--ink); text-decoration: none; border-top: 1px solid var(--hair); }
  .arow:first-child { border-top: 0; }
  .arow .t { color: var(--hair); }
  .arow .t.done { color: inherit; font-weight: 700; }
  .arow:hover { background: var(--ink); color: var(--plate); }
  .arow:hover .t { color: var(--steel); }
  .arow:hover .t.done { color: inherit; }
  .aempty, .lbnote { padding: 9px 10px; color: var(--steel); }

  .lbhead, .lbrow { display: grid; grid-template-columns: 64px 1fr auto; padding: 7px 10px; }
  .lbrow { border-top: 1px solid var(--hair); font-size: 14px; font-weight: 700; }
  .lbrow:first-child { border-top: 0; }
  .lbrow.out { border-top: 2px solid var(--ink); }
  .lbrow.me { color: var(--signal); }

  .lbform, .lbsent { max-width: 440px; width: 100%; margin: 0 auto; border: 2px solid var(--ink); background: var(--plate); display: grid; align-items: stretch; font: 700 12px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .lbform { grid-template-columns: 1fr auto auto auto; }
  .lbform .lbl, .lbform .tm { display: grid; align-items: center; padding: 0 12px; min-width: 0; }
  .lbform .tm { font-size: 14px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .inits { display: flex; }
  .inits input { appearance: none; width: 38px; height: 40px; margin: 0; padding: 0; border: 0; border-left: 2px solid var(--ink); background: var(--paper); color: var(--ink); text-align: center; text-transform: uppercase; font: 700 18px var(--f-mono); }
  .inits input:last-child { border-right: 2px solid var(--ink); }
  .inits input:focus { outline: 3px solid var(--signal); outline-offset: -3px; }
  .lbform .ctl { border-left: 2px solid var(--ink); }
  .lbsent { grid-template-columns: 1fr auto; }
  .lbsent span, .lbsent a { padding: 11px 12px; }
  .lbsent a { border-left: 2px solid var(--ink); color: var(--ink); text-decoration: none; }
  .lbsent a:hover { background: var(--ink); color: var(--plate); }
</style>
</head>
<body>
<nav class="bar" aria-label="Site"><div class="in"><a href="../#return">&larr; Back to room</a></div></nav>
<div class="sheet">
  <header class="mast">
    <h1>Daily Logic</h1>
    <div class="ids"><span id="no"></span><span id="date"></span></div>
  </header>

  <div class="amark" id="amark" hidden><span id="amarktext"></span><a href="#">Today &rarr;</a></div>

  <nav class="views" id="views" aria-label="Views">
    <a data-v="play" href="#">Puzzles</a><a data-v="archive" href="#archive">Archive</a><a data-v="board" href="#board" hidden>Leaderboard</a>
  </nav>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Puzzles"></nav>

  <section id="panel" style="display:grid;gap:12px">
    <div class="meta"><span id="gmeta"></span><span class="clock" id="clock">00:00</span></div>
    <div id="boardslot"></div>
    <div class="solvedbar" id="solved" hidden><span>Solved</span><span id="solvedtime"></span></div>
    <form class="lbform" id="lbform" hidden autocomplete="off">
      <span class="lbl">Initials</span>
      <span class="inits"><input aria-label="First initial" maxlength="3" autocapitalize="characters" autocorrect="off" spellcheck="false"><input aria-label="Second initial" maxlength="3" autocapitalize="characters" autocorrect="off" spellcheck="false"><input aria-label="Third initial" maxlength="3" autocapitalize="characters" autocorrect="off" spellcheck="false"></span>
      <span class="tm" id="lbtime"></span>
      <button class="ctl" id="lbsubmit" type="submit" disabled>Submit</button>
    </form>
    <div class="lbsent" id="lbsent" hidden><span id="lbsenttext"></span><a id="lbsentlink" href="#board">Leaderboard &rarr;</a></div>
    <div class="controls"><button class="ctl" id="undo">Undo</button><button class="ctl" id="clear">Clear</button></div>
    <div class="rules"><p id="rules"></p><span class="taps" id="taps"></span></div>
  </section>

  <section id="archive" hidden>
    <div class="atable">
      <div class="ahead"><span>No.</span><span>Date</span><span class="t">Sectors</span><span class="t">Binary</span><span class="t">Weights</span></div>
      <div id="arows"></div>
    </div>
  </section>

  <section id="board" hidden style="display:grid;gap:12px">
    <div class="meta"><span id="lbmeta"></span><span id="lbcount"></span></div>
    <div class="lbtable">
      <div class="lbhead"><span>Rank</span><span>Initials</span><span>Time</span></div>
      <div id="lbrows"></div>
    </div>
  </section>

  <section class="summary" id="summary" hidden>
    <pre id="sharetext"></pre>
    <div class="row"><span class="next" id="next"></span><button class="ctl" id="copy">Copy</button></div>
    <textarea id="sharebox" rows="5" readonly hidden aria-label="Result to copy"></textarea>
  </section>

</div>

<script>
const DL = (() => {
  "use strict";
  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function mulberry32(a) {
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function rng(seed) {
    const r = mulberry32(hashStr(seed));
    const ri = (a, b) => a + Math.floor(r() * (b - a + 1));
    const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
    return { r, ri, shuffle };
  }
  const range = (n) => Array.from({ length: n }, (_, i) => i);

  // ---------------- SECTORS (one marker per row / column / sector, no touching) ----------------
  function sectorsSolve(regions, n, limit = 2) {
    const sols = [], cur = [];
    const colUsed = new Array(n).fill(false), regUsed = new Array(n).fill(false);
    (function rec(row, prev) {
      if (row === n) { sols.push(cur.slice()); return; }
      for (let c = 0; c < n && sols.length < limit; c++) {
        if (colUsed[c] || (prev >= 0 && Math.abs(c - prev) <= 1)) continue;
        const g = regions[row * n + c];
        if (regUsed[g]) continue;
        colUsed[c] = regUsed[g] = true; cur[row] = c;
        rec(row + 1, c);
        colUsed[c] = regUsed[g] = false;
      }
    })(0, -1);
    return sols;
  }
  const sectorsCount = (regions, n, limit = 2) => sectorsSolve(regions, n, limit).length;
  function connectedWithout(regions, n, g, skip) {
    const cells = [];
    for (let k = 0; k < n * n; k++) if (regions[k] === g && k !== skip) cells.push(k);
    if (!cells.length) return false;
    const seen = new Set([cells[0]]), stack = [cells[0]];
    while (stack.length) {
      const k = stack.pop(), r = Math.floor(k / n), c = k % n;
      for (const kk of [r > 0 ? k - n : -1, r < n - 1 ? k + n : -1, c > 0 ? k - 1 : -1, c < n - 1 ? k + 1 : -1]) {
        if (kk < 0 || kk === skip || seen.has(kk) || regions[kk] !== g) continue;
        seen.add(kk); stack.push(kk);
      }
    }
    return seen.size === cells.length;
  }
  function repairSectors(regions, cols, n, R) {
    for (let step = 0; step < 400; step++) {
      const sols = sectorsSolve(regions, n, 2);
      if (sols.length === 1) return true;
      const alt = sols.find((s) => s.some((c, r) => c !== cols[r]));
      let moved = false;
      for (const r of R.shuffle(range(n).filter((r) => alt[r] !== cols[r]))) {
        const k = r * n + alt[r], own = regions[k], rr = Math.floor(k / n), cc = k % n;
        const nbrs = [rr > 0 ? k - n : -1, rr < n - 1 ? k + n : -1, cc > 0 ? k - 1 : -1, cc < n - 1 ? k + 1 : -1]
          .filter((x) => x >= 0 && regions[x] !== own).map((x) => regions[x]);
        if (!nbrs.length || !connectedWithout(regions, n, own, k)) continue;
        regions[k] = nbrs[R.ri(0, nbrs.length - 1)];
        moved = true; break;
      }
      if (!moved) return false;
    }
    return false;
  }
  function genSectors(seed, n = 7) {
    const R = rng(seed);
    let last = null;
    for (let attempt = 1; attempt <= 200; attempt++) {
      const cols = [], used = new Array(n).fill(false);
      (function place(row) {
        if (row === n) return true;
        for (const c of R.shuffle(range(n))) {
          if (used[c] || (row > 0 && Math.abs(c - cols[row - 1]) <= 1)) continue;
          used[c] = true; cols[row] = c;
          if (place(row + 1)) return true;
          used[c] = false;
        }
        return false;
      })(0);
      const regions = new Array(n * n).fill(-1);
      for (let i = 0; i < n; i++) regions[i * n + cols[i]] = i;
      let left = n * n - n;
      while (left > 0) {
        const g = R.ri(0, n - 1), cand = [];
        for (let k = 0; k < n * n; k++) {
          if (regions[k] !== g) continue;
          const r = Math.floor(k / n), c = k % n;
          if (r > 0 && regions[k - n] === -1) cand.push(k - n);
          if (r < n - 1 && regions[k + n] === -1) cand.push(k + n);
          if (c > 0 && regions[k - 1] === -1) cand.push(k - 1);
          if (c < n - 1 && regions[k + 1] === -1) cand.push(k + 1);
        }
        if (!cand.length) continue;
        regions[cand[R.ri(0, cand.length - 1)]] = g; left--;
      }
      last = { n, regions, solution: cols, attempts: attempt, unique: false };
      if (repairSectors(regions, cols, n, R)) { last.unique = true; return last; }
    }
    return last;
  }

  // ---------------- BINARY (0/1 grid with = and × joints) ----------------
  // cells: array n*n of null|0|1 (givens); h: n*(n-1) joints right of (r,c); v: (n-1)*n joints below (r,c)
  function binarySolve(n, givens, h, v, limit = 2, randomize = null) {
    const g = new Array(n * n).fill(-1), half = n / 2;
    const rowCnt = range(n).map(() => [0, 0]), colCnt = range(n).map(() => [0, 0]);
    let count = 0, first = null;
    (function rec(k) {
      if (k === n * n) { count++; if (!first) first = g.slice(); return; }
      const r = Math.floor(k / n), c = k % n;
      let vals = givens[k] != null ? [givens[k]] : randomize ? (randomize() < 0.5 ? [0, 1] : [1, 0]) : [0, 1];
      for (const val of vals) {
        if (count >= limit) return;
        if (rowCnt[r][val] >= half || colCnt[c][val] >= half) continue;
        if (c >= 2 && g[k - 1] === val && g[k - 2] === val) continue;
        if (r >= 2 && g[k - n] === val && g[k - 2 * n] === val) continue;
        if (c > 0) { const j = h[r * (n - 1) + c - 1]; if (j === "=" && g[k - 1] !== val) continue; if (j === "x" && g[k - 1] === val) continue; }
        if (r > 0) { const j = v[(r - 1) * n + c]; if (j === "=" && g[k - n] !== val) continue; if (j === "x" && g[k - n] === val) continue; }

      el.addEventListener("click", (e) => { if (!g.drag || e.detail === 0) tap(k); });
    });
    if (g.drag) {
      board.classList.add("draggable");
      dragAbort = new AbortController();
      const signal = dragAbort.signal;
      let drag = null;
      const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); return el ? els.indexOf(el.closest ? el.closest(".cell") : el) : -1; };
      const apply = (k) => {
        if (k < 0 || drag.seen.has(k)) return;
        drag.seen.add(k);
        if (drag.mode === "paint" && s.cells[k] === 0) s.cells[k] = 1;
        if (drag.mode === "erase" && s.cells[k] === 1) s.cells[k] = 0;
      };
      board.addEventListener("pointerdown", (e) => {
        const k = els.indexOf(e.target.closest(".cell"));
        if (k < 0 || saves[active].done || e.button > 0) return;
        e.preventDefault();
        drag = { start: k, moved: false, mode: s.cells[k] === 1 ? "erase" : "paint", seen: new Set(), snap: s.cells.slice() };
      });
      window.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const k = cellAt(e.clientX, e.clientY);
        if (k < 0 || (k === drag.start && !drag.moved)) return;
        if (!drag.moved) { drag.moved = true; apply(drag.start); }
        apply(k); refresh();
      }, { signal });
      const end = () => {
        if (!drag) return;
        const d = drag; drag = null;
        if (!d.moved) { tap(d.start); return; }
        if (s.cells.some((v, i) => v !== d.snap[i])) history.push(d.snap);
        refresh();
      };
      window.addEventListener("pointerup", end, { signal });
      window.addEventListener("pointercancel", end, { signal });
    }
    $("#gmeta").textContent = `${g.name} / ${p.n}×${p.n}`;
    $("#rules").textContent = g.rules;
    $("#taps").textContent = g.taps;
    renderTabs();
    refresh();
  }

  function refresh() {
    const g = GAMES[active], p = puzzles[active], s = saves[active];
    const delay = g.errorDelay || 0;
    clearTimeout(errTimer);
    const solved = g.paint(p, s.cells, els, delay === 0);
    if (delay && !solved) {
      const at = active, atKey = key;
      errTimer = setTimeout(() => { if (active === at && key === atKey && view === "play") g.paint(p, saves[at].cells, els, true); }, delay);
    }
    if (solved && !s.done) { s.done = true; }
    save(active);
    const board = $("#boardslot").firstChild;
    board.classList.toggle("solved", s.done);
    $("#solved").hidden = !s.done;
    $("#solvedtime").textContent = fmt(s.elapsed);
    $("#clock").textContent = fmt(s.elapsed);
    $("#undo").disabled = s.done || history.length === 0;
    $("#clear").disabled = s.done;
    renderTabs();
    renderSummary();
    lbForm();
  }

  function renderSummary() {
    const all = saves.every((s) => s.done);
    $("#summary").hidden = !all || view !== "play";
    if (!all) return;
    $("#sharetext").textContent = shareText();
    $("#next").textContent = isToday() ? `Next set in ${untilMidnight()}` : `Archive / No. ${pad3(viewNo)}`;
  }
  function shareText() {
    const lines = GAMES.map((g, i) => `${g.name.toUpperCase().padEnd(8)} ${fmt(saves[i].elapsed)}`);
    return `DAILY LOGIC No.${pad3(viewNo)}${isToday() ? "" : " (ARCHIVE)"}\n${lines.join("\n")}\npatricksliz.com`;
  }
  function untilMidnight() {
    const now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const s = Math.max(0, Math.floor((next - now) / 1000));
    return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((x) => String(x).padStart(2, "0")).join(":");
  }

  $("#undo").onclick = () => {
    const s = saves[active];
    if (s.done || !history.length) return;
    s.cells = history.pop(); refresh();
  };
  $("#clear").onclick = () => {
    const s = saves[active];
    if (s.done) return;
    history.push(s.cells.slice());
    s.cells = GAMES[active].init(puzzles[active]); refresh();
  };
  $("#copy").onclick = () => {
    const text = shareText(), box = $("#sharebox"), btn = $("#copy");
    const fallback = () => { box.value = text; box.hidden = false; box.focus(); box.select(); };
    const ok = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1600); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback(); }
    catch (e) { fallback(); }
  };

  // ---------- archive ----------
  function renderArchive() {
    const rows = [];
    for (let no = todayNo - 1; no >= 1; no--) {
      const d = dateOf(no), k = dayKey(d);
      const cells = GAMES.map((g) => {
        const s = store.get(k + ":" + g.id, null);
        return s && s.done ? `<span class="t done">${fmt(s.elapsed)}</span>` : `<span class="t">--:--</span>`;
      }).join("");
      rows.push(`<a class="arow" href="#${pad3(no)}"><span>${pad3(no)}</span><span>${dots(d)}</span>${cells}</a>`);
    }
    $("#arows").innerHTML = rows.join("") || `<div class="aempty">No past sets yet</div>`;
  }

  // ---------- leaderboard ----------
  function lbOff() { // backend unreachable: drop the feature for this visit, keep the puzzles
    LB.on = false;
    if (view === "board") { window.history.replaceState(null, "", hashFor("play") === "#" ? location.pathname + location.search : hashFor("play")); show("play"); }
    else { syncViews(); lbForm(); }
  }
  async function renderBoard() {
    const g = GAMES[active], seq = ++lbSeq, no = viewNo;
    $("#lbmeta").textContent = `Leaderboard / ${g.name} / No. ${pad3(no)}`;
    $("#lbcount").textContent = "";
    $("#lbrows").innerHTML = `<div class="lbnote">Loading</div>`;
    let rows;
    try { rows = await LB.list(no, g.id); } catch (e) { if (seq === lbSeq) lbOff(); return; }
    if (seq !== lbSeq || view !== "board") return;
    const mine = store.get("lb:" + key + ":" + g.id, null);
    const me = mine ? rows.findIndex((r) => r.initials === mine.initials && r.ms === mine.ms) : -1;
    const rank = (i) => 1 + rows.filter((r) => r.ms < rows[i].ms).length; // ties share a rank
    const line = (i, cls = "") => `<div class="lbrow${i === me ? " me" : ""}${cls}"><span>${String(rank(i)).padStart(2, "0")}</span><span>${rows[i].initials}</span><span>${fmt(Math.round(rows[i].ms / 1000))}</span></div>`;
    let html = rows.slice(0, 10).map((_, i) => line(i)).join("");
    if (me >= 10) html += line(me, " out");
    $("#lbrows").innerHTML = html || `<div class="lbnote">No entries</div>`;
    $("#lbcount").textContent = `${rows.length} ${rows.length === 1 ? "entry" : "entries"}`;
  }

  // initials row under a solved board: today's puzzles only, once per puzzle per device
  const inits = [...document.querySelectorAll("#lbform input")];
  const initials = () => inits.map((i) => i.value).join("");
  const syncSubmit = () => { $("#lbsubmit").disabled = !/^[A-Z]{1,3}$/.test(initials()); };
  inits.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      const letters = inp.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3 - i);
      inp.value = letters.slice(0, 1);
      for (let j = 1; j < letters.length; j++) inits[i + j].value = letters[j];
      if (letters) inits[Math.min(2, i + letters.length)].focus();
      syncSubmit();
    });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !inp.value && i > 0) { e.preventDefault(); inits[i - 1].value = ""; inits[i - 1].focus(); syncSubmit(); }
    });
    inp.addEventListener("focus", () => inp.select());
  });
  function lbForm() {
    const g = GAMES[active], s = saves[active], id = key + ":" + g.id;
    const can = LB.on && view === "play" && isToday() && s.done && s.elapsed >= 5 && s.elapsed <= 3600;
    const sent = can ? store.get("lb:" + id, null) : null;
    $("#lbform").hidden = !can || !!sent;
    $("#lbsent").hidden = !sent;
    if (sent) { $("#lbsenttext").textContent = `Submitted / ${sent.initials} / ${fmt(Math.round(sent.ms / 1000))}`; $("#lbsentlink").href = hashFor("board"); }
    if (can && !sent && formFor !== id) {
      formFor = id;
      const last = String(store.get("initials", "") || "");
      inits.forEach((inp, i) => (inp.value = /^[A-Z]{1,3}$/.test(last) ? last[i] || "" : ""));
      $("#lbtime").textContent = fmt(s.elapsed);
      $("#lbsubmit").textContent = "Submit";
      syncSubmit();
    }
  }
  $("#lbform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const g = GAMES[active], s = saves[active], id = key + ":" + g.id, who = initials(), btn = $("#lbsubmit");
    if (!/^[A-Z]{1,3}$/.test(who) || btn.disabled || !isToday() || !s.done) return;
    const ms = s.elapsed * 1000;
    btn.disabled = true; btn.textContent = "Sending";
    try { await LB.submit({ day: viewNo, game: g.id, initials: who, ms, device: deviceId() }); }
    catch (err) { btn.disabled = false; btn.textContent = "Retry"; return; }
    store.set("initials", who);
    store.set("lb:" + id, { initials: who, ms });
    lbForm();
  });

  // ---------- views + routing ----------
  function syncViews() {
    $("#views").querySelectorAll("a").forEach((a) => {
      const v = a.dataset.v;
      a.href = hashFor(v);
      if (v === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      if (v === "board") a.hidden = !LB.on;
    });
  }
  function show(v) {
    view = v;
    clearTimeout(errTimer);
    $("#panel").hidden = v !== "play";
    $("#archive").hidden = v !== "archive";
    $("#board").hidden = v !== "board";
    $("#tabs").hidden = v === "archive";
    syncViews();
    if (v === "play") open(active);
    else { $("#summary").hidden = true; if (v === "archive") renderArchive(); else { renderTabs(); renderBoard(); } }
  }
  function route() {
    todayNo = dayNo();
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    const m = h.match(/^(\d{1,6})(\/board)?$/);
    let no = todayNo, v = "play";
    if (h === "archive") { v = "archive"; no = viewNo >= 1 && viewNo <= todayNo ? viewNo : todayNo; }
    else if (h === "board") v = "board";
    else if (m && +m[1] >= 1 && +m[1] <= todayNo) { no = +m[1]; if (m[2]) v = "board"; }
    if (v === "board" && !LB.on) v = "play";
    const want = hashFor(v, no);
    if ((location.hash || "#") !== want || (want === "#" && location.href.endsWith("#"))) window.history.replaceState(null, "", want === "#" ? location.pathname + location.search : want);
    if (no !== viewNo) loadDay(no);
    show(v);
  }
  window.addEventListener("hashchange", route);

  function tick() {
    if (dayNo() !== todayNo) { // midnight: today's set becomes an archive day
      const wasToday = isToday();
      todayNo = dayNo();
      if (wasToday) { viewNo = 0; route(); return; }
      $("#amark").hidden = isToday(); syncViews();
    }
    if (view === "play" && document.visibilityState === "visible") {
      const s = saves[active];
      if (!s.done) {
        s.elapsed += 1; save(active);
        $("#clock").textContent = fmt(s.elapsed);
        const tm = $("#tabs").querySelector(`[data-i="${active}"] .tm`); if (tm) tm.textContent = fmt(s.elapsed);
      }
    }
    if (!$("#summary").hidden && isToday()) $("#next").textContent = `Next set in ${untilMidnight()}`;
  }

  route();
  ticker = setInterval(tick, 1000);
})();
</script>
</body>
</html>
