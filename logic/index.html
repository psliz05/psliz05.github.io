<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Logic</title>
<meta name="description" content="Three daily logic puzzles by Patrick Sliz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a single printed spec sheet. Hard rules, square corners, one signal color for errors. Single light theme by design. */
  :root {
    --paper: #e6e6e1;
    --plate: #f3f3ef;
    --ink: #141414;
    --steel: #66665f;
    --hair: #b9b9b2;
    --given: #d6d6cf;
    --signal: #ff4a00;
    --tone-0: #f3f3ef;
    --tone-1: #e2e2dc;
    --tone-2: #d2d2ca;
    --tone-3: #eaeae5;
    --f-sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; border-radius: 0; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  .sheet {
    max-width: 520px; margin: 0 auto;
    padding-block: 20px 36px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 16px;
  }

  .mast { border-top: 6px solid var(--ink); border-bottom: 2px solid var(--ink); padding-block: 8px 10px; display: grid; grid-template-columns: 1fr auto; row-gap: 2px; align-items: end; }
  .mast h1 { margin: 0; font: 800 34px/0.95 var(--f-sans); font-stretch: 70%; text-transform: uppercase; letter-spacing: -0.01em; }
  .mast .ids { display: flex; flex-direction: column; align-items: flex-end; font: 500 12px/1.4 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink); }
  .tab { appearance: none; background: var(--plate); border: 0; border-left: 2px solid var(--ink); padding: 8px 10px 9px; text-align: left; cursor: pointer; display: grid; gap: 1px; min-width: 0; }
  .tab:first-child { border-left: 0; }
  .tab .no { font: 500 11px var(--f-mono); color: var(--steel); }
  .tab .nm { font: 750 17px/1.1 var(--f-sans); font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.01em; }
  .tab .tm { font: 500 12px var(--f-mono); color: var(--steel); font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--plate); }
  .tab[aria-selected="true"] .no, .tab[aria-selected="true"] .tm { color: var(--hair); }
  .tab.done .tm::before { content: "■ "; }

  .meta { display: flex; justify-content: space-between; align-items: baseline; font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .meta .clock { font-size: 20px; font-weight: 700; letter-spacing: 0; font-variant-numeric: tabular-nums; }

  .board { position: relative; width: 100%; max-width: 440px; margin: 0 auto; display: grid; background: var(--plate); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .cell { appearance: none; border: 0; padding: 0; margin: 0; aspect-ratio: 1; display: grid; place-items: center; background: transparent; cursor: pointer; position: relative; min-width: 0; font: 700 clamp(18px, 6vw, 28px) var(--f-mono); }
  .cell:focus-visible, .tab:focus-visible, .ctl:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; z-index: 2; }
  .board.solved .cell { cursor: default; }
  .board.draggable { touch-action: none; }

  /* Sectors */
  .b-sectors { border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
  .b-sectors .cell { border-top: 1px solid var(--hair); border-left: 1px solid var(--hair); }
  .b-sectors .cell.bt { border-top: 3px solid var(--ink); }
  .b-sectors .cell.bl { border-left: 3px solid var(--ink); }
  .b-sectors .cell[data-v="x"]::after { content: "×"; font: 500 clamp(14px, 4.4vw, 20px) var(--f-mono); color: var(--steel); }
  .b-sectors .cell[data-v="q"]::after { content: ""; width: 44%; height: 44%; background: var(--ink); }
  .b-sectors .cell.bad[data-v="q"]::after { background: var(--signal); }

  /* Binary */
  .b-binary { border: 2px solid var(--ink); }
  .b-binary .cell { border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .b-binary .cell.r-end { border-right: 0; } .b-binary .cell.b-end { border-bottom: 0; }
  .b-binary .cell.given { background: var(--given); cursor: default; }
  .b-binary .cell.bad { color: var(--signal); }
  .joint { position: absolute; width: 18px; height: 18px; transform: translate(-50%, -50%); background: var(--plate); border: 1.5px solid var(--ink); display: grid; place-items: center; font: 700 12px/1 var(--f-mono); pointer-events: none; z-index: 1; }
  .joint.bad { border-color: var(--signal); color: var(--signal); }

  /* Weights */
  .b-weights { background: transparent; }
  .b-weights .lab { display: grid; place-items: center; font: 500 13px var(--f-mono); color: var(--steel); aspect-ratio: 1; min-width: 0; }
  .b-weights .clue { display: grid; place-items: center; font: 700 15px var(--f-mono); aspect-ratio: 1; min-width: 0; border: 2px solid transparent; }
  .b-weights .clue.ok { background: var(--ink); color: var(--plate); }
  .b-weights .clue.over { border-color: var(--signal); color: var(--signal); }
  .b-weights .cell { background: var(--plate); border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .b-weights .cell.l-edge { border-left: 2px solid var(--ink); } .b-weights .cell.r-edge { border-right: 2px solid var(--ink); }
  .b-weights .cell.t-edge { border-top: 2px solid var(--ink); } .b-weights .cell.b-edge { border-bottom: 2px solid var(--ink); }
  .b-weights .cell[data-v="f"]::after { content: ""; position: absolute; inset: 3px; background: var(--ink); }
  .b-weights .cell.given { background: var(--given); cursor: default; }
  .b-weights .cell[data-v="x"]::after { content: "×"; font: 500 clamp(14px, 4.4vw, 20px) var(--f-mono); color: var(--steel); }

  .solvedbar { background: var(--ink); color: var(--plate); font: 700 13px var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 9px 12px; display: flex; justify-content: space-between; max-width: 440px; width: 100%; margin: 0 auto; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0; max-width: 440px; width: 100%; margin: 0 auto; border: 2px solid var(--ink); }
  .ctl { appearance: none; background: var(--plate); border: 0; padding: 11px; font: 700 13px var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; }
  .ctl + .ctl { border-left: 2px solid var(--ink); }
  .ctl:hover:not(:disabled) { background: var(--ink); color: var(--plate); }
  .ctl:disabled { color: var(--hair); cursor: default; }

  .rules { max-width: 440px; width: 100%; margin: 0 auto; border-top: 1px solid var(--ink); padding-top: 10px; display: grid; gap: 6px; }
  .rules p { margin: 0; font-size: 14px; }
  .rules .taps { font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--steel); }

  .summary { border: 2px solid var(--ink); background: var(--plate); display: grid; }
  .summary pre { margin: 0; padding: 12px; font: 500 13px/1.6 var(--f-mono); white-space: pre; overflow-x: auto; }
  .summary .row { display: grid; grid-template-columns: 1fr auto; border-top: 2px solid var(--ink); align-items: stretch; }
  .summary .next { font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.04em; padding: 11px 12px; color: var(--steel); }
  .summary .ctl { border-left: 2px solid var(--ink); }
  .summary textarea { width: 100%; border: 0; border-top: 2px solid var(--ink); font: 13px/1.5 var(--f-mono); padding: 10px 12px; background: var(--paper); color: var(--ink); resize: none; }

  .foot { border-top: 2px solid var(--ink); padding-top: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .foot nav { display: flex; flex-wrap: wrap; gap: 14px; }
  .foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); }
  .foot a:hover { color: var(--signal); border-color: var(--signal); }
  .foot .mail { text-transform: none; }
  .bar { border-bottom: 2px solid var(--ink); background: var(--plate); }
  .bar .in { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar a { display: inline-block; padding: 11px 0; color: var(--ink); font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
  .bar a:hover { color: var(--signal); }
</style>
</head>
<body>
<nav class="bar" aria-label="Site"><div class="in"><a href="../#return">&larr; Back to room</a></div></nav>
<div class="sheet">
  <header class="mast">
    <h1>Daily Logic</h1>
    <div class="ids"><span id="no"></span><span id="date"></span></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Puzzles"></nav>

  <section id="panel" style="display:grid;gap:12px">
    <div class="meta"><span id="gmeta"></span><span class="clock" id="clock">00:00</span></div>
    <div id="boardslot"></div>
    <div class="solvedbar" id="solved" hidden><span>Solved</span><span id="solvedtime"></span></div>
    <div class="controls"><button class="ctl" id="undo">Undo</button><button class="ctl" id="clear">Clear</button></div>
    <div class="rules"><p id="rules"></p><span class="taps" id="taps"></span></div>
  </section>

  <section class="summary" id="summary" hidden>
    <pre id="sharetext"></pre>
    <div class="row"><span class="next">Next set in <span id="cd"></span></span><button class="ctl" id="copy">Copy</button></div>
    <textarea id="sharebox" rows="5" readonly hidden aria-label="Result to copy"></textarea>
  </section>

</div>

<script>
const DL = (() => {
  "use strict";
  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function mulberry32(a) {
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function rng(seed) {
    const r = mulberry32(hashStr(seed));
    const ri = (a, b) => a + Math.floor(r() * (b - a + 1));
    const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
    return { r, ri, shuffle };
  }
  const range = (n) => Array.from({ length: n }, (_, i) => i);

  // ---------------- SECTORS (one marker per row / column / sector, no touching) ----------------
  function sectorsSolve(regions, n, limit = 2) {
    const sols = [], cur = [];
    const colUsed = new Array(n).fill(false), regUsed = new Array(n).fill(false);
    (function rec(row, prev) {
      if (row === n) { sols.push(cur.slice()); return; }
      for (let c = 0; c < n && sols.length < limit; c++) {
        if (colUsed[c] || (prev >= 0 && Math.abs(c - prev) <= 1)) continue;
        const g = regions[row * n + c];
        if (regUsed[g]) continue;
        colUsed[c] = regUsed[g] = true; cur[row] = c;
        rec(row + 1, c);
        colUsed[c] = regUsed[g] = false;
      }
    })(0, -1);
    return sols;
  }
  const sectorsCount = (regions, n, limit = 2) => sectorsSolve(regions, n, limit).length;
  function connectedWithout(regions, n, g, skip) {
    const cells = [];
    for (let k = 0; k < n * n; k++) if (regions[k] === g && k !== skip) cells.push(k);
    if (!cells.length) return false;
    const seen = new Set([cells[0]]), stack = [cells[0]];
    while (stack.length) {
      const k = stack.pop(), r = Math.floor(k / n), c = k % n;
      for (const kk of [r > 0 ? k - n : -1, r < n - 1 ? k + n : -1, c > 0 ? k - 1 : -1, c < n - 1 ? k + 1 : -1]) {
        if (kk < 0 || kk === skip || seen.has(kk) || regions[kk] !== g) continue;
        seen.add(kk); stack.push(kk);
      }
    }
    return seen.size === cells.length;
  }
  function repairSectors(regions, cols, n, R) {
    for (let step = 0; step < 400; step++) {
      const sols = sectorsSolve(regions, n, 2);
      if (sols.length === 1) return true;
      const alt = sols.find((s) => s.some((c, r) => c !== cols[r]));
      let moved = false;
      for (const r of R.shuffle(range(n).filter((r) => alt[r] !== cols[r]))) {
        const k = r * n + alt[r], own = regions[k], rr = Math.floor(k / n), cc = k % n;
        const nbrs = [rr > 0 ? k - n : -1, rr < n - 1 ? k + n : -1, cc > 0 ? k - 1 : -1, cc < n - 1 ? k + 1 : -1]
          .filter((x) => x >= 0 && regions[x] !== own).map((x) => regions[x]);
        if (!nbrs.length || !connectedWithout(regions, n, own, k)) continue;
        regions[k] = nbrs[R.ri(0, nbrs.length - 1)];
        moved = true; break;
      }
      if (!moved) return false;
    }
    return false;
  }
  function genSectors(seed, n = 7) {
    const R = rng(seed);
    let last = null;
    for (let attempt = 1; attempt <= 200; attempt++) {
      const cols = [], used = new Array(n).fill(false);
      (function place(row) {
        if (row === n) return true;
        for (const c of R.shuffle(range(n))) {
          if (used[c] || (row > 0 && Math.abs(c - cols[row - 1]) <= 1)) continue;
          used[c] = true; cols[row] = c;
          if (place(row + 1)) return true;
          used[c] = false;
        }
        return false;
      })(0);
      const regions = new Array(n * n).fill(-1);
      for (let i = 0; i < n; i++) regions[i * n + cols[i]] = i;
      let left = n * n - n;
      while (left > 0) {
        const g = R.ri(0, n - 1), cand = [];
        for (let k = 0; k < n * n; k++) {
          if (regions[k] !== g) continue;
          const r = Math.floor(k / n), c = k % n;
          if (r > 0 && regions[k - n] === -1) cand.push(k - n);
          if (r < n - 1 && regions[k + n] === -1) cand.push(k + n);
          if (c > 0 && regions[k - 1] === -1) cand.push(k - 1);
          if (c < n - 1 && regions[k + 1] === -1) cand.push(k + 1);
        }
        if (!cand.length) continue;
        regions[cand[R.ri(0, cand.length - 1)]] = g; left--;
      }
      last = { n, regions, solution: cols, attempts: attempt, unique: false };
      if (repairSectors(regions, cols, n, R)) { last.unique = true; return last; }
    }
    return last;
  }

  // ---------------- BINARY (0/1 grid with = and × joints) ----------------
  // cells: array n*n of null|0|1 (givens); h: n*(n-1) joints right of (r,c); v: (n-1)*n joints below (r,c)
  function binarySolve(n, givens, h, v, limit = 2, randomize = null) {
    const g = new Array(n * n).fill(-1), half = n / 2;
    const rowCnt = range(n).map(() => [0, 0]), colCnt = range(n).map(() => [0, 0]);
    let count = 0, first = null;
    (function rec(k) {
      if (k === n * n) { count++; if (!first) first = g.slice(); return; }
      const r = Math.floor(k / n), c = k % n;
      let vals = givens[k] != null ? [givens[k]] : randomize ? (randomize() < 0.5 ? [0, 1] : [1, 0]) : [0, 1];
      for (const val of vals) {
        if (count >= limit) return;
        if (rowCnt[r][val] >= half || colCnt[c][val] >= half) continue;
        if (c >= 2 && g[k - 1] === val && g[k - 2] === val) continue;
        if (r >= 2 && g[k - n] === val && g[k - 2 * n] === val) continue;
        if (c > 0) { const j = h[r * (n - 1) + c - 1]; if (j === "=" && g[k - 1] !== val) continue; if (j === "x" && g[k - 1] === val) continue; }
        if (r > 0) { const j = v[(r - 1) * n + c]; if (j === "=" && g[k - n] !== val) continue; if (j === "x" && g[k - n] === val) continue; }
        g[k] = val; rowCnt[r][val]++; colCnt[c][val]++;
        rec(k + 1);
        g[k] = -1; rowCnt[r][val]--; colCnt[c][val]--;
      }
    })(0);
    return { count, first };
  }
  function genBinary(seed, n = 6) {
    const R = rng(seed);
    const none = new Array(n * n).fill(null);
    const emptyH = new Array(n * (n - 1)).fill(null), emptyV = new Array((n - 1) * n).fill(null);
    const solution = binarySolve(n, none, emptyH, emptyV, 1, R.r).first;
    const h = emptyH.slice(), v = emptyV.slice();
    const joints = R.shuffle([...range(h.length).map((i) => ["h", i]), ...range(v.length).map((i) => ["v", i])]);
    const nJ = R.ri(8, 11);
    for (const [t, i] of joints.slice(0, nJ)) {
      if (t === "h") { const r = Math.floor(i / (n - 1)), c = i % (n - 1); h[i] = solution[r * n + c] === solution[r * n + c + 1] ? "=" : "x"; }
      else { const r = Math.floor(i / n), c = i % n; v[i] = solution[r * n + c] === solution[(r + 1) * n + c] ? "=" : "x"; }
    }
    const givens = solution.slice();
    const MIN_GIVENS = 7;
    for (const k of R.shuffle(range(n * n))) {
      if (givens.filter((x) => x != null).length <= MIN_GIVENS) break;
      const keep = givens[k]; givens[k] = null;
      if (!binaryLogic(n, givens, h, v)) givens[k] = keep;
    }
    return { n, givens, h, v, solution, unique: binarySolve(n, givens, h, v, 2).count === 1, logical: binaryLogic(n, givens, h, v) };
  }
  // Human-style deduction only: pairs, gaps, full counts, joints. Returns true if it fills the grid.
  function binaryLogic(n, givens, h, v) {
    const g = givens.map((x) => (x == null ? -1 : x)), half = n / 2;
    const lines = [];
    for (let r = 0; r < n; r++) lines.push(range(n).map((c) => r * n + c));
    for (let c = 0; c < n; c++) lines.push(range(n).map((r) => r * n + c));
    const joints = [];
    h.forEach((s, i) => { if (s) { const r = Math.floor(i / (n - 1)), c = i % (n - 1); joints.push([s, r * n + c, r * n + c + 1]); } });
    v.forEach((s, i) => { if (s) { const r = Math.floor(i / n), c = i % n; joints.push([s, r * n + c, (r + 1) * n + c]); } });
    let changed = true;
    const set = (k, val) => { if (g[k] === -1) { g[k] = val; changed = true; } };
    while (changed) {
      changed = false;
      for (const L of lines) {
        for (let i = 0; i < n; i++) {
          const a = g[L[i]];
          if (i + 1 < n && a !== -1 && g[L[i + 1]] === a) { if (i - 1 >= 0) set(L[i - 1], 1 - a); if (i + 2 < n) set(L[i + 2], 1 - a); }
          if (i + 2 < n && a !== -1 && g[L[i + 2]] === a) set(L[i + 1], 1 - a);
        }
        for (const val of [0, 1]) if (L.filter((k) => g[k] === val).length === half) L.forEach((k) => set(k, 1 - val));
      }
      for (const [s, a, b] of joints) {
        if (g[a] !== -1 && g[b] === -1) set(b, s === "=" ? g[a] : 1 - g[a]);
        if (g[b] !== -1 && g[a] === -1) set(a, s === "=" ? g[b] : 1 - g[b]);
      }
    }
    return g.every((x, k) => x !== -1);
  }

  // ---------------- WEIGHTS (row/column index sums) ----------------
  function weightsCount(n, rowS, colS, limit = 2) {
    const bySum = new Map();
    for (let m = 0; m < 1 << n; m++) {
      let s = 0; for (let c = 0; c < n; c++) if (m & (1 << c)) s += c + 1;
      if (!bySum.has(s)) bySum.set(s, []); bySum.get(s).push(m);
    }
    const remAfter = range(n).map((r) => { let s = 0; for (let k = r + 1; k < n; k++) s += k + 1; return s; });
    const acc = new Array(n).fill(0);
    let count = 0;
    (function rec(r) {
      if (r === n) { if (acc.every((a, c) => a === colS[c])) count++; return; }
      for (const m of bySum.get(rowS[r]) || []) {
        if (count >= limit) return;
        let ok = true;
        for (let c = 0; c < n; c++) if (m & (1 << c)) acc[c] += r + 1;
        for (let c = 0; c < n; c++) { const need = colS[c] - acc[c]; if (need < 0 || need > remAfter[r]) { ok = false; break; } }
        if (ok) rec(r + 1);
        for (let c = 0; c < n; c++) if (m & (1 << c)) acc[c] -= r + 1;
      }
    })(0);
    return count;
  }
  // Line logic: for each row/column, keep only subsets that hit the clue and agree with known cells;
  // a cell that is the same in every surviving subset is forced. Returns true if it fills the grid.
  function weightsLogic(n, rowS, colS, givens) {
    const g = givens.map((x) => (x == null ? -1 : x));
    const subsets = new Map();
    for (let m = 0; m < 1 << n; m++) { let s = 0; for (let i = 0; i < n; i++) if (m & (1 << i)) s += i + 1; if (!subsets.has(s)) subsets.set(s, []); subsets.get(s).push(m); }
    let changed = true;
    const solveLine = (idx, clue) => {
      const cands = (subsets.get(clue) || []).filter((m) => idx.every((k, i) => g[k] === -1 || g[k] === ((m >> i) & 1)));
      if (!cands.length) return false;
      idx.forEach((k, i) => {
        if (g[k] !== -1) return;
        const ones = cands.filter((m) => (m >> i) & 1).length;
        if (ones === cands.length) { g[k] = 1; changed = true; } else if (ones === 0) { g[k] = 0; changed = true; }
      });
      return true;
    };
    while (changed) {
      changed = false;
      for (let r = 0; r < n; r++) if (!solveLine(range(n).map((c) => r * n + c), rowS[r])) return false;
      for (let c = 0; c < n; c++) if (!solveLine(range(n).map((r) => r * n + c), colS[c])) return false;
    }
    return g.every((x) => x !== -1);
  }
  function genWeights(seed, n = 5) {
    const R = rng(seed);
    let last = null;
    for (let attempt = 1; attempt <= 5000; attempt++) {
      const sol = range(n * n).map(() => (R.r() < 0.5 ? 1 : 0));
      const rowS = range(n).map((r) => range(n).reduce((s, c) => s + (sol[r * n + c] ? c + 1 : 0), 0));
      const colS = range(n).map((c) => range(n).reduce((s, r) => s + (sol[r * n + c] ? r + 1 : 0), 0));
      if (rowS.some((s) => s === 0) || colS.some((s) => s === 0)) continue;
      // reveal cells until plain line logic finishes the grid
      const givens = new Array(n * n).fill(null);
      const order = R.shuffle(range(n * n));
      let i = 0;
      while (!weightsLogic(n, rowS, colS, givens) && i < order.length) { givens[order[i]] = sol[order[i]]; i++; }
      const nGiven = givens.filter((x) => x != null).length;
      last = { n, rowS, colS, solution: sol, givens, attempts: attempt, unique: weightsCount(n, rowS, colS) === 1 || nGiven > 0, logical: weightsLogic(n, rowS, colS, givens) };
      if (nGiven <= 3) return last;
    }
    return last;
  }

  return { genSectors, genBinary, genWeights, sectorsCount, binarySolve, weightsCount };
})();
if (typeof module !== "undefined") module.exports = DL;

</script>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const LAUNCH = new Date(2026, 10, 7);
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const dayNo = (d = new Date()) => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 864e5) + 1;
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const store = {
    get(k, f) { try { const v = localStorage.getItem("dl2:" + k); return v ? JSON.parse(v) : f; } catch (e) { return f; } },
    set(k, v) { try { localStorage.setItem("dl2:" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };

  // ---------- game definitions ----------
  const SECTORS = {
    id: "sectors", name: "Sectors",
    gen: (k) => DL.genSectors("dl-" + k + "-sectors"),
    rules: "Place one ■ in every row, every column and every outlined sector. No two ■ may touch, including at the corners.",
    taps: "Tap a cell: × → ■ → empty. Drag across cells to mark ×.",
    drag: true,
    init: (p) => new Array(p.n * p.n).fill(0),
    next: (v) => (v + 1) % 3,
    locked: () => false,
    build(board, p) {
      const n = p.n, R = p.regions;
      board.className = "board b-sectors";
      board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      // greedy 4-tone coloring of sectors so neighbours differ
      const adj = Array.from({ length: n }, () => new Set());
      for (let k = 0; k < n * n; k++) {
        const r = Math.floor(k / n), c = k % n;
        if (c < n - 1 && R[k] !== R[k + 1]) { adj[R[k]].add(R[k + 1]); adj[R[k + 1]].add(R[k]); }
        if (r < n - 1 && R[k] !== R[k + n]) { adj[R[k]].add(R[k + n]); adj[R[k + n]].add(R[k]); }
      }
      const tone = [];
      for (let g = 0; g < n; g++) { let t = 0; while ([...adj[g]].some((h) => tone[h] === t)) t++; tone[g] = t % 4; }
      const els = [];
      for (let k = 0; k < n * n; k++) {
        const r = Math.floor(k / n), c = k % n, b = document.createElement("button");
        b.className = "cell" + (r === 0 || R[k - n] !== R[k] ? " bt" : "") + (c === 0 || R[k - 1] !== R[k] ? " bl" : "");
        b.style.background = `var(--tone-${tone[R[k]]})`;
        b.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}, sector ${R[k] + 1}`);
        board.appendChild(b); els.push(b);
      }
      return els;
    },
    paint(p, cells, els) {
      const n = p.n, marks = [], bad = new Set();
      cells.forEach((v, k) => { if (v === 2) marks.push(k); });
      for (let i = 0; i < marks.length; i++) for (let j = i + 1; j < marks.length; j++) {
        const a = marks[i], b = marks[j], ar = Math.floor(a / n), ac = a % n, br = Math.floor(b / n), bc = b % n;
        if (ar === br || ac === bc || p.regions[a] === p.regions[b] || (Math.abs(ar - br) <= 1 && Math.abs(ac - bc) <= 1)) { bad.add(a); bad.add(b); }
      }
      els.forEach((el, k) => { el.dataset.v = ["", "x", "q"][cells[k]]; el.classList.toggle("bad", bad.has(k)); });
      return marks.length === n && bad.size === 0;
    },
  };

  const BINARY = {
    id: "binary", name: "Binary",
    gen: (k) => DL.genBinary("dl-" + k + "-binary"),
    rules: "Fill every cell with 0 or 1. Each row and column holds three of each, never three alike in a line. = joins equal cells. × joins different cells.",
    taps: "Tap a cell: 0 → 1 → empty",
    errorDelay: 1500,
    init: (p) => p.givens.map((g) => (g == null ? -1 : g)),
    next: (v) => (v === -1 ? 0 : v === 0 ? 1 : -1),
    locked: (p, k) => p.givens[k] != null,
    build(board, p) {
      const n = p.n;
      board.className = "board b-binary";
      board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      const els = [];
      for (let k = 0; k < n * n; k++) {
        const r = Math.floor(k / n), c = k % n, b = document.createElement("button");
        b.className = "cell" + (c === n - 1 ? " r-end" : "") + (r === n - 1 ? " b-end" : "") + (p.givens[k] != null ? " given" : "");
        b.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}`);
        if (p.givens[k] != null) b.disabled = true;
        board.appendChild(b); els.push(b);
      }
      this.joints = [];
      const addJ = (sym, left, top, a, b) => {
        const j = document.createElement("span");
        j.className = "joint"; j.textContent = sym === "=" ? "=" : "×";
        j.style.left = left + "%"; j.style.top = top + "%";
        board.appendChild(j); this.joints.push({ el: j, sym, a, b });
      };
      p.h.forEach((s, i) => { if (!s) return; const r = Math.floor(i / (n - 1)), c = i % (n - 1); addJ(s, ((c + 1) / n) * 100, ((r + 0.5) / n) * 100, r * n + c, r * n + c + 1); });
      p.v.forEach((s, i) => { if (!s) return; const r = Math.floor(i / n), c = i % n; addJ(s, ((c + 0.5) / n) * 100, ((r + 1) / n) * 100, r * n + c, (r + 1) * n + c); });
      return els;
    },
    paint(p, cells, els, show) {
      const n = p.n, half = n / 2, bad = new Set();
      const line = (idx) => {
        for (const val of [0, 1]) { const hit = idx.filter((k) => cells[k] === val); if (hit.length > half) hit.forEach((k) => bad.add(k)); }
        for (let i = 0; i + 2 < idx.length; i++) {
          const [a, b, c] = [idx[i], idx[i + 1], idx[i + 2]];
          if (cells[a] !== -1 && cells[a] === cells[b] && cells[b] === cells[c]) { bad.add(a); bad.add(b); bad.add(c); }
        }
      };
      for (let r = 0; r < n; r++) line(Array.from({ length: n }, (_, c) => r * n + c));
      for (let c = 0; c < n; c++) line(Array.from({ length: n }, (_, r) => r * n + c));
      for (const j of this.joints) {
        const A = cells[j.a], B = cells[j.b];
        const broken = A !== -1 && B !== -1 && ((j.sym === "=" && A !== B) || (j.sym === "x" && A === B));
        j.el.classList.toggle("bad", show && broken);
        if (broken) { bad.add(j.a); bad.add(j.b); }
      }
      els.forEach((el, k) => { el.textContent = cells[k] === -1 ? "" : String(cells[k]); el.classList.toggle("bad", show && bad.has(k)); });
      return cells.every((v) => v !== -1) && bad.size === 0;
    },
  };

  const WEIGHTS = {
    id: "weights", name: "Weights",
    gen: (k) => DL.genWeights("dl-" + k + "-weights"),
    rules: "Fill cells so each row adds up to its clue on the right, counting the column numbers above the filled cells. Each column adds up to its clue below, counting the row numbers.",
    taps: "Tap a cell: ■ → × → empty",
    errorDelay: 1500,
    init: (p) => p.givens.map((g) => (g == null ? 0 : g === 1 ? 1 : 2)),
    next: (v) => (v + 1) % 3,
    locked: (p, k) => p.givens[k] != null,
    build(board, p) {
      const n = p.n;
      board.className = "board b-weights";
      board.style.gridTemplateColumns = `repeat(${n + 2}, 1fr)`;
      const lab = (t, cls = "lab") => { const s = document.createElement("span"); s.className = cls; s.textContent = t; board.appendChild(s); return s; };
      lab("");
      for (let c = 0; c < n; c++) lab(String(c + 1));
      lab("");
      const els = []; this.rowClues = []; this.colClues = [];
      for (let r = 0; r < n; r++) {
        lab(String(r + 1));
        for (let c = 0; c < n; c++) {
          const b = document.createElement("button");
          const given = p.givens[r * n + c] != null;
          b.className = "cell" + (c === 0 ? " l-edge" : "") + (c === n - 1 ? " r-edge" : "") + (r === 0 ? " t-edge" : "") + (r === n - 1 ? " b-edge" : "") + (given ? " given" : "");
          if (given) b.disabled = true;
          b.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}`);
          board.appendChild(b); els.push(b);
        }
        this.rowClues.push(lab(String(p.rowS[r]), "clue"));
      }
      lab("");
      for (let c = 0; c < n; c++) this.colClues.push(lab(String(p.colS[c]), "clue"));
      lab("");
      return els;
    },
    paint(p, cells, els, show) {
      const n = p.n; let solved = true;
      for (let r = 0; r < n; r++) {
        let s = 0; for (let c = 0; c < n; c++) if (cells[r * n + c] === 1) s += c + 1;
        this.rowClues[r].className = "clue" + (s === p.rowS[r] ? " ok" : show && s > p.rowS[r] ? " over" : "");
        if (s !== p.rowS[r]) solved = false;
      }
      for (let c = 0; c < n; c++) {
        let s = 0; for (let r = 0; r < n; r++) if (cells[r * n + c] === 1) s += r + 1;
        this.colClues[c].className = "clue" + (s === p.colS[c] ? " ok" : show && s > p.colS[c] ? " over" : "");
        if (s !== p.colS[c]) solved = false;
      }
      els.forEach((el, k) => (el.dataset.v = ["", "f", "x"][cells[k]]));
      return solved;
    },
  };

  const GAMES = [SECTORS, BINARY, WEIGHTS];

  // ---------- state ----------
  let key, puzzles, saves, active = 0, els = [], history = [], ticker = null, errTimer = null;

  function save(i) { store.set(key + ":" + GAMES[i].id, saves[i]); }

  function renderTabs() {
    $("#tabs").innerHTML = GAMES.map((g, i) => {
      const s = saves[i];
      return `<button class="tab${s.done ? " done" : ""}" role="tab" aria-selected="${i === active}" data-i="${i}">
        <span class="no">0${i + 1}</span><span class="nm">${g.name}</span><span class="tm">${s.done || s.elapsed ? fmt(s.elapsed) : "--:--"}</span></button>`;
    }).join("");
    $("#tabs").querySelectorAll(".tab").forEach((t) => (t.onclick = () => open(+t.dataset.i)));
  }

  function open(i) {
    clearTimeout(errTimer);
    active = i; history = [];
    const g = GAMES[i], p = puzzles[i], s = saves[i];
    const board = document.createElement("div");
    $("#boardslot").replaceChildren(board);
    els = g.build(board, p);
    const tap = (k) => {
      if (saves[active].done || g.locked(p, k)) return;
      history.push(s.cells.slice());
      s.cells[k] = g.next(s.cells[k]);
      refresh();
    };
    els.forEach((el, k) => {
      // Keyboard activation (detail 0) always taps; pointer taps go through the drag handler on drag boards.
      el.addEventListener("click", (e) => { if (!g.drag || e.detail === 0) tap(k); });
    });
    if (g.drag) {
      board.classList.add("draggable");
      let drag = null;
      const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); return el ? els.indexOf(el.closest ? el.closest(".cell") : el) : -1; };
      const apply = (k) => {
        if (k < 0 || drag.seen.has(k)) return;
        drag.seen.add(k);
        if (drag.mode === "paint" && s.cells[k] === 0) s.cells[k] = 1;
        if (drag.mode === "erase" && s.cells[k] === 1) s.cells[k] = 0;
      };
      board.addEventListener("pointerdown", (e) => {
        const k = els.indexOf(e.target.closest(".cell"));
        if (k < 0 || saves[active].done || e.button > 0) return;
        e.preventDefault();
        drag = { start: k, moved: false, mode: s.cells[k] === 1 ? "erase" : "paint", seen: new Set(), snap: s.cells.slice() };
      });
      window.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const k = cellAt(e.clientX, e.clientY);
        if (k < 0 || (k === drag.start && !drag.moved)) return;
        if (!drag.moved) { drag.moved = true; apply(drag.start); }
        apply(k); refresh();
      });
      const end = () => {
        if (!drag) return;
        const d = drag; drag = null;
        if (!d.moved) { tap(d.start); return; }
        if (s.cells.some((v, i) => v !== d.snap[i])) history.push(d.snap);
        refresh();
      };
      window.addEventListener("pointerup", end);
      window.addEventListener("pointercancel", end);
    }
    $("#gmeta").textContent = `${g.name} / ${p.n}×${p.n}`;
    $("#rules").textContent = g.rules;
    $("#taps").textContent = g.taps;
    renderTabs();
    refresh();
  }

  function refresh() {
    const g = GAMES[active], p = puzzles[active], s = saves[active];
    const delay = g.errorDelay || 0;
    clearTimeout(errTimer);
    const solved = g.paint(p, s.cells, els, delay === 0);
    if (delay && !solved) {
      const at = active;
      errTimer = setTimeout(() => { if (active === at) g.paint(p, saves[at].cells, els, true); }, delay);
    }
    if (solved && !s.done) { s.done = true; }
    save(active);
    const board = $("#boardslot").firstChild;
    board.classList.toggle("solved", s.done);
    $("#solved").hidden = !s.done;
    $("#solvedtime").textContent = fmt(s.elapsed);
    $("#clock").textContent = fmt(s.elapsed);
    $("#undo").disabled = s.done || history.length === 0;
    $("#clear").disabled = s.done;
    renderTabs();
    renderSummary();
  }

  function renderSummary() {
    const all = saves.every((s) => s.done);
    $("#summary").hidden = !all;
    if (!all) return;
    $("#sharetext").textContent = shareText();
    $("#cd").textContent = untilMidnight();
  }
  function shareText() {
    const lines = GAMES.map((g, i) => `${g.name.toUpperCase().padEnd(8)} ${fmt(saves[i].elapsed)}`);
    return `DAILY LOGIC No.${String(dayNo()).padStart(3, "0")}\n${lines.join("\n")}\npatricksliz.com`;
  }
  function untilMidnight() {
    const now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const s = Math.max(0, Math.floor((next - now) / 1000));
    return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((x) => String(x).padStart(2, "0")).join(":");
  }

  $("#undo").onclick = () => {
    const s = saves[active];
    if (s.done || !history.length) return;
    s.cells = history.pop(); refresh();
  };
  $("#clear").onclick = () => {
    const s = saves[active];
    if (s.done) return;
    history.push(s.cells.slice());
    s.cells = GAMES[active].init(puzzles[active]); refresh();
  };
  $("#copy").onclick = () => {
    const text = shareText(), box = $("#sharebox"), btn = $("#copy");
    const fallback = () => { box.value = text; box.hidden = false; box.focus(); box.select(); };
    const ok = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1600); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback(); }
    catch (e) { fallback(); }
  };

  function tick() {
    if (dayKey() !== key) { boot(); return; }
    if (document.visibilityState === "visible") {
      const s = saves[active];
      if (!s.done) {
        s.elapsed += 1; save(active);
        $("#clock").textContent = fmt(s.elapsed);
        const tm = $("#tabs").querySelector(`[data-i="${active}"] .tm`); if (tm) tm.textContent = fmt(s.elapsed);
      }
    }
    if (!$("#summary").hidden) $("#cd").textContent = untilMidnight();
  }

  function boot() {
    key = dayKey();
    const d = new Date();
    $("#no").textContent = `No. ${String(dayNo()).padStart(3, "0")}`;
    $("#date").textContent = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
    puzzles = GAMES.map((g) => g.gen(key));
    saves = GAMES.map((g, i) => {
      const s = store.get(key + ":" + g.id, null);
      const fresh = { cells: g.init(puzzles[i]), elapsed: 0, done: false };
      return s && Array.isArray(s.cells) && s.cells.length === fresh.cells.length ? s : fresh;
    });
    const firstOpen = saves.findIndex((s) => !s.done);
    open(firstOpen === -1 ? 0 : firstOpen);
    clearInterval(ticker);
    ticker = setInterval(tick, 1000);
  }

  boot();
})();
</script>
