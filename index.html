<!doctype html>
<html lang="en" class="mode-room">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrick Sliz</title>
<meta name="description" content="Personal site of Patrick Sliz.">
<meta name="theme-color" content="#e6e6e1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141414'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23ff4a00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js">
<style>
  :root {
    --paper: #e6e6e1;
    --plate: #f3f3ef;
    --ink: #141414;
    --steel: #66665f;
    --hair: #b9b9b2;
    --given: #d6d6cf;
    --signal: #ff4a00;
    --f-sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sl: env(safe-area-inset-left, 0px);
    --sr: env(safe-area-inset-right, 0px);
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  * { box-sizing: border-box; border-radius: 0; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- room mode ---------- */
  html.mode-room, html.mode-room body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  html.mode-list #room { display: none; }
  #room { position: fixed; inset: 0; height: 100vh; height: 100dvh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .mono { font: 500 12px/1.4 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; }

  #crosshair { position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--ink); outline: 1px solid var(--plate); }
  #crosshair::before { left: 7px; top: 0; width: 1px; height: 15px; }
  #crosshair::after { left: 0; top: 7px; width: 15px; height: 1px; }
  #crosshair.on::before, #crosshair.on::after { background: var(--signal); outline-color: var(--ink); }

  #prompt { position: absolute; left: 50%; top: calc(50% + 84px); transform: translateX(-50%); display: flex; border: 2px solid var(--ink); background: var(--plate); pointer-events: none; white-space: nowrap; }
  #prompt span { padding: 6px 10px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  #prompt .key { background: var(--ink); color: var(--plate); }

  #toast { position: absolute; left: 50%; bottom: calc(26px + var(--sb)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--ink); color: var(--plate); padding: 9px 14px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: center; pointer-events: none; opacity: 0; transition: opacity 160ms ease-out; }
  #toast.on { opacity: 1; }
  .touch #toast { bottom: auto; top: calc(56px + var(--st)); }

  .chip { position: absolute; top: calc(12px + var(--st)); right: calc(12px + var(--sr)); appearance: none; border: 2px solid var(--ink); background: var(--plate); padding: 6px 10px; font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; touch-action: manipulation; }
  .chip:hover { background: var(--ink); color: var(--plate); }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

  /* touch controls */
  #joy { position: absolute; left: calc(22px + var(--sl)); bottom: calc(26px + var(--sb)); width: 124px; height: 124px; border: 2px solid var(--ink); background: rgba(243, 243, 239, 0.55); touch-action: none; }
  #joy::before, #joy::after { content: ""; position: absolute; background: var(--hair); }
  #joy::before { left: 50%; top: 8px; bottom: 8px; width: 1px; }
  #joy::after { top: 50%; left: 8px; right: 8px; height: 1px; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; background: var(--ink); z-index: 1; will-change: transform; }
  #open { position: absolute; right: calc(22px + var(--sr)); bottom: calc(26px + var(--sb)); display: grid; justify-items: end; gap: 6px; }
  #open-label { background: var(--plate); border: 2px solid var(--ink); padding: 4px 8px; font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  #open-btn { appearance: none; border: 2px solid var(--ink); background: var(--signal); color: var(--ink); width: 124px; height: 64px; font: 800 24px/1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.04em; text-transform: uppercase; touch-action: manipulation; }
  #open-btn:active { background: var(--ink); color: var(--plate); }

  /* start / pause panel */
  #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100% - 32px)); background: var(--plate); border: 2px solid var(--ink); border-top-width: 6px; display: grid; }
  #panel h1 { margin: 0; padding: 12px 14px 10px; font: 800 40px/0.95 var(--f-sans); font-stretch: 70%; text-transform: uppercase; letter-spacing: -0.01em; border-bottom: 2px solid var(--ink); }
  #panel .go { appearance: none; border: 0; background: var(--ink); color: var(--plate); padding: 16px 14px; font: 800 22px/1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.04em; text-transform: uppercase; text-align: left; cursor: pointer; display: flex; justify-content: space-between; touch-action: manipulation; }
  #panel .go:hover { background: var(--signal); color: var(--ink); }
  #panel .legend { margin: 0; padding: 10px 14px; border-top: 2px solid var(--ink); color: var(--steel); font: 500 11px/1.6 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; }
  #panel .alt { appearance: none; border: 0; border-top: 2px solid var(--ink); background: transparent; padding: 10px 14px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer; display: flex; justify-content: space-between; touch-action: manipulation; }
  #panel .alt:hover { background: var(--ink); color: var(--plate); }

  #loader { position: absolute; inset: 0; background: var(--paper); display: grid; place-content: center; gap: 8px; font: 700 13px/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; z-index: 5; }
  #loader .bar { width: 180px; height: 6px; border: 1px solid var(--ink); }
  #loader .bar i { display: block; height: 100%; width: 0; background: var(--ink); }
  #pct { font-weight: 700; font-variant-numeric: tabular-nums; }

  #fade { position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; transition: opacity 240ms ease-out; z-index: 6; }
  #fade.on { opacity: 1; }

  /* ---------- list view ---------- */
  #list { max-width: 520px; margin: 0 auto; padding-block: 20px 36px; padding-left: max(16px, var(--sl)); padding-right: max(16px, var(--sr)); display: flex; flex-direction: column; gap: 16px; }
  #list .mast { border-top: 6px solid var(--ink); border-bottom: 2px solid var(--ink); padding-block: 8px 10px; display: grid; grid-template-columns: 1fr auto; align-items: end; }
  #list .mast h1 { margin: 0; font: 800 34px/0.95 var(--f-sans); font-stretch: 70%; text-transform: uppercase; letter-spacing: -0.01em; }
  #list .mast span { font: 500 12px/1.4 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; }
  #rows { list-style: none; margin: 0; padding: 0; border: 2px solid var(--ink); background: var(--plate); }
  #rows li + li { border-top: 2px solid var(--ink); }
  #rows a { display: grid; grid-template-columns: 34px 1fr auto 18px; align-items: baseline; gap: 8px; padding: 12px; text-decoration: none; }
  #rows a:hover, #rows a:focus-visible { background: var(--ink); color: var(--plate); outline: none; }
  #rows .no { font: 500 12px var(--f-mono); color: var(--steel); }
  #rows .nm { font: 750 20px/1.1 var(--f-sans); font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.01em; }
  #rows .to { font: 500 11px var(--f-mono); color: var(--steel); overflow-wrap: anywhere; text-align: right; }
  #rows .ar { font: 700 14px var(--f-mono); text-align: right; }
  #rows a:hover .no, #rows a:hover .to, #rows a:focus-visible .no, #rows a:focus-visible .to { color: var(--hair); }
  #list .enter { appearance: none; border: 2px solid var(--ink); background: var(--plate); padding: 11px 12px; font: 700 13px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer; display: flex; justify-content: space-between; }
  #list .enter:hover { background: var(--ink); color: var(--plate); }
  #list .note { margin: 0; font: 500 11.5px/1.5 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--steel); }
  noscript p { max-width: 520px; margin: 24px auto; padding: 0 16px; font: 500 13px/1.6 var(--f-mono); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="room">
  <canvas id="gl" tabindex="-1" aria-label="3D room. Use List view for a plain list of links."></canvas>
  <div id="crosshair" hidden></div>
  <div id="prompt" hidden><span id="prompt-label"></span><span class="key" id="prompt-key">E / CLICK</span></div>
  <div id="joy" hidden><div id="joy-knob"></div></div>
  <div id="open" hidden><span id="open-label"></span><button id="open-btn" type="button">Open</button></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <button id="listbtn" class="chip" type="button" hidden>List view</button>
  <div id="panel" hidden>
    <h1 id="panel-title"></h1>
    <button class="go" id="panel-go" type="button"><span id="panel-go-text"></span><span aria-hidden="true">&rarr;</span></button>
    <p class="legend" id="panel-legend"></p>
    <button class="alt" id="panel-list" type="button"><span>List view</span><span aria-hidden="true">&rarr;</span></button>
  </div>
  <div id="loader" role="status"><span>Loading <span id="pct">0</span>%</span><div class="bar"><i id="pctbar"></i></div></div>
  <div id="fade"></div>
</div>

<main id="list" hidden>
  <header class="mast"><h1 id="list-title"></h1><span>Index</span></header>
  <ol id="rows"></ol>
  <button class="enter" id="list-enter" type="button" hidden><span>Enter room</span><span aria-hidden="true">&rarr;</span></button>
  <p class="note" id="list-note" hidden></p>
</main>

<noscript><p>This page needs JavaScript. <a href="research/">Research</a> / <a href="logic/">Daily Logic</a></p></noscript>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
// =====================================================================
// CONFIG — edit links and toggles here. Everything below reads from it.
// =====================================================================
const CONFIG = {
  NAME: "Patrick Sliz",
  LINKEDIN_URL: "https://www.linkedin.com/in/patrick-sliz",
  ARTICLES_URL: "https://harvardindependent.com/author/patricksliz/",
  SHOW_NAME_ON_WALL: true,            // name in large lettering on the back wall
  WALL_CAPTION: "Harvard College / A.B. candidate, Computational Neuroscience / May 2027", // small line under the name; "" to hide
  INCLUDE_EMAIL_OBJECT: true,         // mailbox object -> mailto
  EMAIL: "patrick.sliz@gmail.com",
  RESUME_PDF: "resume.pdf",           // null to remove the filing cabinet
  RESEARCH_PATH: "research/",
  LOGIC_PATH: "logic/",
};
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js";

// ---------- destinations (shared by the room and the list view) ----------
// kind: "nav" = same-tab page on this site, "tab" = new tab, "mail" = mailto
const DEST = [
  { id: "research", label: "Research", kind: "nav", href: CONFIG.RESEARCH_PATH, shown: "/" + CONFIG.RESEARCH_PATH },
  { id: "linkedin", label: "LinkedIn", kind: "tab", href: CONFIG.LINKEDIN_URL, shown: pretty(CONFIG.LINKEDIN_URL) },
  { id: "logic", label: "Daily Logic", kind: "nav", href: CONFIG.LOGIC_PATH, shown: "/" + CONFIG.LOGIC_PATH },
  CONFIG.RESUME_PDF && { id: "resume", label: "Résumé", kind: "tab", href: CONFIG.RESUME_PDF, shown: "PDF" },
  { id: "articles", label: "Articles", kind: "tab", href: CONFIG.ARTICLES_URL, shown: pretty(CONFIG.ARTICLES_URL) },
  CONFIG.INCLUDE_EMAIL_OBJECT && CONFIG.EMAIL && { id: "email", label: "Email", kind: "mail", href: "mailto:" + CONFIG.EMAIL, shown: CONFIG.EMAIL },
].filter(Boolean);
DEST.forEach((d, i) => (d.no = String(i + 1).padStart(2, "0")));
function pretty(u) { return String(u).replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""); }

// ---------- DOM ----------
const $ = (s) => document.querySelector(s);
const html = document.documentElement;
const el = {
  room: $("#room"), gl: $("#gl"), cross: $("#crosshair"), prompt: $("#prompt"), promptLabel: $("#prompt-label"), promptKey: $("#prompt-key"),
  joy: $("#joy"), knob: $("#joy-knob"), open: $("#open"), openLabel: $("#open-label"), openBtn: $("#open-btn"),
  toast: $("#toast"), listBtn: $("#listbtn"), panel: $("#panel"), panelTitle: $("#panel-title"), panelGo: $("#panel-go"), panelGoText: $("#panel-go-text"),
  panelLegend: $("#panel-legend"), panelList: $("#panel-list"), loader: $("#loader"), pct: $("#pct"), pctBar: $("#pctbar"), fade: $("#fade"),
  list: $("#list"), listTitle: $("#list-title"), rows: $("#rows"), listEnter: $("#list-enter"), listNote: $("#list-note"),
};
const TOUCH = matchMedia("(pointer: coarse)").matches;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CAN_LOCK = !TOUCH && "requestPointerLock" in el.gl;
if (TOUCH) html.classList.add("touch");

// ---------- list view (works with no WebGL and no Three.js) ----------
el.listTitle.textContent = CONFIG.SHOW_NAME_ON_WALL ? CONFIG.NAME : "Index";
for (const d of DEST) {
  const li = document.createElement("li"), a = document.createElement("a");
  a.href = d.href;
  if (d.kind === "tab") { a.target = "_blank"; a.rel = "noopener"; }
  for (const [cls, text] of [["no", d.no], ["nm", d.label], ["to", d.shown], ["ar", d.kind === "nav" ? "→" : "↗"]]) {
    const s = document.createElement("span"); s.className = cls; s.textContent = text; a.appendChild(s);
  }
  li.appendChild(a); el.rows.appendChild(li);
}
let room = null; // set once the 3D scene is built
function showList(reason) {
  if (room) room.leave();
  html.classList.replace("mode-room", "mode-list");
  el.list.hidden = false;
  el.listEnter.hidden = !room;
  el.listNote.hidden = !reason;
  if (reason) el.listNote.textContent = reason;
  try { history.replaceState(null, "", "#list"); } catch (e) { /* ignore */ }
}
function hideList() {
  html.classList.replace("mode-list", "mode-room");
  el.list.hidden = true;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* ignore */ }
}

// ---------- loader ----------
let pctNow = 0, pctGoal = 8;
const pctTimer = setInterval(() => {
  if (pctNow < pctGoal) pctNow += Math.max(1, Math.round((pctGoal - pctNow) * 0.25));
  else if (pctGoal < 58) pctGoal += 1; // slow creep while the 3D library downloads
  el.pct.textContent = pctNow; el.pctBar.style.width = pctNow + "%";
}, 70);
const setPct = (n) => { pctGoal = Math.max(pctGoal, n); };
function endLoader() { clearInterval(pctTimer); el.pct.textContent = "100"; el.pctBar.style.width = "100%"; el.loader.hidden = true; }

// ---------- boot ----------
boot();
async function boot() {
  let THREE;
  try {
    const probe = document.createElement("canvas");
    if (!(probe.getContext("webgl2") || probe.getContext("webgl"))) throw new Error("no webgl");
    THREE = await import("three").catch(() => import(THREE_URL));
    setPct(64);
    await Promise.race([
      Promise.all([
        document.fonts.load('800 condensed 64px "Archivo"'),
        document.fonts.load('700 32px "JetBrains Mono"'),
        document.fonts.load('500 32px "JetBrains Mono"'),
      ]),
      new Promise((r) => setTimeout(r, 1800)),
    ]).catch(() => {});
    setPct(78);
    room = buildRoom(THREE);
  } catch (err) {
    endLoader();
    showList("3D view is not available on this device or browser.");
    return;
  }
  endLoader();
  el.listBtn.hidden = false;
  el.listBtn.addEventListener("click", () => showList());
  el.panelList.addEventListener("click", () => showList());
  el.listEnter.addEventListener("click", () => { hideList(); room.enterFromList(); });
  if (location.hash === "#list") showList();
  else if (location.hash === "#return" || /^\/(research|logic)\//.test((() => { try { const u = new URL(document.referrer); return u.origin === location.origin ? u.pathname : ""; } catch (e) { return ""; } })()) || (performance.getEntriesByType && (performance.getEntriesByType("navigation")[0] || {}).type === "back_forward")) {
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* ignore */ }
    if (!room.resume()) room.start();
  } else room.start();
}

// =====================================================================
// THE ROOM
// =====================================================================
function buildRoom(THREE) {
  const C = { paper: 0xe6e6e1, plate: 0xf3f3ef, ink: 0x141414, steel: 0x66665f, hair: 0xb9b9b2, given: 0xd6d6cf, signal: 0xff4a00, wall: 0xefefea, floor: 0xcbcbc4, white: 0xffffff };
  const CSS = { paper: "#e6e6e1", plate: "#f3f3ef", ink: "#141414", steel: "#66665f", hair: "#b9b9b2", given: "#d6d6cf", signal: "#ff4a00" };
  const F_SANS = '"Archivo", "Helvetica Neue", Arial, sans-serif';
  const F_MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
  const ROOM = 12, HALF = ROOM / 2, CEIL = 4, EYE = 1.6, RADIUS = 0.34, REACH = 3;

  // ---------- renderer ----------
  const renderer = new THREE.WebGLRenderer({ canvas: el.gl, antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(C.paper);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, 1, 0.03, 60);
  camera.rotation.order = "YXZ";
  scene.add(camera);

  // ---------- materials ----------
  const lam = (color) => new THREE.MeshLambertMaterial({ color, flatShading: true });
  const M = {
    plate: lam(C.plate), paper: lam(C.paper), given: lam(C.given), steel: lam(C.steel), hair: lam(C.hair), ink: lam(0x1b1b1b), wall: lam(C.wall), page: lam(0xfafaf6),
    inkFlat: new THREE.MeshBasicMaterial({ color: C.ink }),
    signalFlat: new THREE.MeshBasicMaterial({ color: C.signal }),
    signal: lam(C.signal),
  };

  // ---------- helpers ----------
  function mesh(geo, mat, x = 0, y = 0, z = 0, shadow = true) {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; return m;
  }
  const box = (w, h, d, mat, x, y, z, shadow) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, shadow);
  const cyl = (r, h, seg, mat, x, y, z, shadow) => mesh(new THREE.CylinderGeometry(r, r, h, seg), mat, x, y, z, shadow);
  function canvasTex(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); if (draw) draw(g, w, h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
    return { c, g, t };
  }
  // text that never overflows: squeezes horizontally if wider than maxW
  function fitText(g, text, x, y, maxW, align = "left") {
    const w = g.measureText(text).width, s = Math.min(1, maxW / w);
    g.save(); g.translate(x, y); g.scale(s, 1); g.textAlign = align; g.fillText(text, 0, 0); g.restore();
  }
  const decal = (tex, w, h, opts = {}) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: !!opts.transparent, depthWrite: !opts.transparent, toneMapped: false, opacity: opts.opacity ?? 1, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  const ease = (k) => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a))); // 0..1 progress of t inside [a,b]
  const toward = (k, want, dt, dur) => (REDUCED ? want : k + Math.sign(want - k) * Math.min(Math.abs(want - k), dt / dur)); // hover progress

  // ---------- shell: floor, walls, ceiling ----------
  {
    const floorTex = canvasTex(1024, 1024, (g, w, h) => {
      g.fillStyle = "#cdcdc6"; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 5200; i++) { // fine concrete speckle
        const v = 196 + Math.floor(Math.random() * 18);
        g.fillStyle = `rgba(${v},${v},${v - 6},${0.35 + Math.random() * 0.4})`;
        g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2.5, 1 + Math.random() * 2.5);
      }
      g.fillStyle = "rgba(20,20,20,0.20)"; // slab joints every 3 m
      for (let i = 1; i < 4; i++) { g.fillRect(Math.round((i * w) / 4) - 1, 0, 2, h); g.fillRect(0, Math.round((i * h) / 4) - 1, w, 2); }
    });

    fromPose.pos.copy(camera.position); fromPose.quat.copy(camera.quaternion);
    toPose.pos.copy(c).addScaledVector(n, dist);
    const m = new THREE.Matrix4().lookAt(toPose.pos, c, new THREE.Vector3(0, 1, 0)); toPose.quat.setFromRotationMatrix(m);
    tween = { t: 0, dur: 0.75, onDone: go };
  }

  // ---------- HUD / panel ----------
  function hud() {
    const playing = state === "play";
    el.cross.hidden = !(playing && !TOUCH);
    el.joy.hidden = !(playing && TOUCH);
    if (!playing) { el.prompt.hidden = true; el.open.hidden = true; }
    el.listBtn.hidden = !(playing || state === "pause" || state === "start") || (playing && CAN_LOCK);
    el.panel.hidden = !(state === "start" || state === "pause");
    el.gl.style.cursor = playing && !CAN_LOCK && !TOUCH ? "grab" : "";
  }
  function showPanel(kind) {
    el.panelTitle.textContent = kind === "pause" ? "Paused" : CONFIG.SHOW_NAME_ON_WALL ? CONFIG.NAME : "Room";
    el.panelGoText.textContent = kind === "pause" ? "Resume" : TOUCH ? "Tap to enter" : "Click to enter";
    el.panelLegend.textContent = TOUCH ? "Left pad: move / Drag: look / Tap an object: open" : CAN_LOCK ? "WASD: move / Mouse: look / E or click: open / Shift: fast / Space: jump / Esc: pause" : "WASD: move / Drag: look / E or click: open / Shift: fast / Space: jump";
    hud();
  }
  function begin() { // enter play (first time: glide from the idle orbit to the spawn point)
    if (state === "play" || state === "intro" || state === "busy") return;
    if (!entered && !REDUCED) {
      entered = true; state = "intro";
      fromPose.pos.copy(camera.position); fromPose.quat.copy(camera.quaternion);
      tween = { t: 0, dur: 0.6, follow: true, onDone: () => { state = "play"; hud(); } };
    } else { entered = true; state = "play"; }
    hud();
    el.gl.focus({ preventScroll: true });
  }
  function pause() {
    if (state !== "play" && state !== "intro") return;
    tween = null; state = "pause"; keys.clear(); resetJoy(); setTarget(null); showPanel("pause");
  }
  function requestEnter() {
    if (CAN_LOCK) {
      try { const p = el.gl.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* stays on the panel */ }
    } else begin();
  }
  el.panelGo.addEventListener("click", requestEnter);
  document.addEventListener("pointerlockchange", () => {
    if (document.pointerLockElement === el.gl) begin();
    else if (state === "play" || state === "intro") pause();
  });
  document.addEventListener("pointerlockerror", () => {});

  // ---------- keyboard + mouse ----------
  const GAME_KEYS = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "ShiftLeft", "ShiftRight", "KeyE"]);
  window.addEventListener("keydown", (e) => {
    if ((state === "start" || state === "pause") && e.code === "Enter" && !e.repeat && document.activeElement === document.body) { e.preventDefault(); return requestEnter(); }
    if (state !== "play") return;
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    if (e.code === "KeyE" && !e.repeat) activate(target);
    else if (e.code === "Escape" && !CAN_LOCK) pause();
    else keys.add(e.code);
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));
  window.addEventListener("blur", () => { keys.clear(); resetJoy(); });
  document.addEventListener("mousemove", (e) => {
    if (document.pointerLockElement !== el.gl || (state !== "play" && state !== "intro")) return;
    player.yaw -= e.movementX * 0.0022;
    player.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, player.pitch - e.movementY * 0.0022));
  });

  // ---------- pointer: look-drag (touch, or mouse when pointer lock is unavailable) + joystick ----------
  el.gl.addEventListener("pointerdown", (e) => {
    if (state !== "play" || document.pointerLockElement === el.gl) return;
    if (look.id !== null) return;
    look.id = e.pointerId; look.x = e.clientX; look.y = e.clientY; look.moved = 0; look.t0 = performance.now();
    try { el.gl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  el.gl.addEventListener("pointermove", (e) => {
    if (e.pointerId !== look.id) return;
    const dx = e.clientX - look.x, dy = e.clientY - look.y; look.x = e.clientX; look.y = e.clientY; look.moved += Math.abs(dx) + Math.abs(dy);
    if (state !== "play") return;
    const k = 0.0052 * (camera.fov / 70);
    player.yaw -= dx * k; player.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, player.pitch - dy * k));
  });
  const endLook = (e) => { if (e.pointerId === look.id) look.id = null; };
  el.gl.addEventListener("pointerup", endLook); el.gl.addEventListener("pointercancel", endLook);
  // click = activate. Locked desktop: whatever is under the crosshair. Touch / no-lock: whatever was tapped.
  el.gl.addEventListener("click", (e) => {
    if (state !== "play") return;
    if (document.pointerLockElement === el.gl) return activate(target);
    if (look.moved > 12) return; // that was a drag, not a tap
    const r = el.gl.getBoundingClientRect();
    const o = pick(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), 30);
    if (!o) return;
    if (camera.position.distanceTo(o.center) <= REACH + 1.6) activate(o); else toast("Move closer");
  });
  el.openBtn.addEventListener("click", () => activate(target));

  const JOY_R = 40;
  function resetJoy() { joy.id = null; joy.x = joy.y = 0; el.knob.style.transform = ""; }
  function moveJoy(e) {
    let dx = e.clientX - joy.cx, dy = e.clientY - joy.cy; const d = Math.hypot(dx, dy);
    if (d > JOY_R) { dx *= JOY_R / d; dy *= JOY_R / d; }
    el.knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const dead = 0.12, nx = dx / JOY_R, ny = dy / JOY_R;
    joy.x = Math.abs(nx) < dead ? 0 : nx; joy.y = Math.abs(ny) < dead ? 0 : ny;
  }
  el.joy.addEventListener("pointerdown", (e) => {
    if (joy.id !== null) return;
    const r = el.joy.getBoundingClientRect(); joy.id = e.pointerId; joy.cx = r.left + r.width / 2; joy.cy = r.top + r.height / 2;
    try { el.joy.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    moveJoy(e); e.preventDefault();
  });
  el.joy.addEventListener("pointermove", (e) => { if (e.pointerId === joy.id) moveJoy(e); });
  const endJoy = (e) => { if (e.pointerId === joy.id) resetJoy(); };
  el.joy.addEventListener("pointerup", endJoy); el.joy.addEventListener("pointercancel", endJoy);
  // no pinch / double-tap zoom or context menu while in the room
  for (const type of ["gesturestart", "gesturechange", "dblclick", "contextmenu"]) el.room.addEventListener(type, (e) => e.preventDefault());
  el.room.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

  // ---------- loop ----------
  function frame(now) {
    rafId = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; time += dt;
    if (state === "start") orbit(time);
    else if (state === "play") updatePlayer(dt);
    else if (state === "intro") updatePlayer(dt);
    if (tween) {
      tween.t += Math.min(0.25, (now - (tween.at || now)) / 1000); tween.at = now; const k = ease(tween.t / tween.dur); // real time, so slow devices still finish on schedule
      if (tween.follow) playerPose(toPose);
      camera.position.lerpVectors(fromPose.pos, toPose.pos, k); camera.quaternion.slerpQuaternions(fromPose.quat, toPose.quat, k);
      if (tween.t >= tween.dur) { const done = tween.onDone; tween = null; done && done(); }
    }
    for (const o of objects) {
      if (o.t >= 0) { o.t += dt; shadowDirty = 2; if (o.t > (o.dur || 1)) { o.update && o.update(dt, time, o.dur || 1); o.t = -1; continue; } }
      o.update && o.update(dt, time, o.t);
    }
    updateAmbient(time);
    if (state === "play") updateTarget();
    if (shadowDirty > 0) { renderer.shadowMap.needsUpdate = true; shadowDirty--; }
    renderer.render(scene, camera);
  }
  function run() { if (!rafId && !document.hidden && state !== "list") { last = performance.now(); rafId = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(rafId); rafId = 0; }
  document.addEventListener("visibilitychange", () => { if (document.hidden) { stop(); keys.clear(); resetJoy(); } else run(); });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  el.gl.addEventListener("webglcontextlost", (e) => { e.preventDefault(); stop(); });
  el.gl.addEventListener("webglcontextrestored", () => { shadowDirty = 3; run(); });
  // back button after a zoom-in navigation (page restored from the back/forward cache)
  window.addEventListener("pageshow", (e) => {
    if (!e.persisted || state !== "busy") return;
    el.fade.classList.remove("on"); tween = null;
    for (const o of objects) o.t = -1;
    if (TOUCH || !CAN_LOCK) { state = "play"; hud(); } else { state = "pause"; showPanel("pause"); }
    updatePlayer(0); run();
  });

  resize();
  setPct(94);
  orbit(0); renderer.shadowMap.needsUpdate = true; renderer.render(scene, camera);

  return {
    start() { state = "start"; showPanel("start"); run(); },
    resume() { // returning from a sub-page: put the player back where they clicked in
      let p = null; try { p = JSON.parse(sessionStorage.getItem("room:pose")); } catch (e) { /* ignore */ }
      if (!p || !isFinite(p.x) || !isFinite(p.z) || !isFinite(p.yaw)) return false;
      player.x = p.x; player.z = p.z; player.yaw = p.yaw; player.pitch = isFinite(p.pitch) ? p.pitch : -0.04;
      player.vx = player.vz = player.vy = 0; player.y = 0; entered = true;
      updatePlayer(0);
      if (TOUCH || !CAN_LOCK) { state = "play"; hud(); } else { state = "pause"; showPanel("pause"); }
      run(); return true;
    },
    leave() { // going to the list view
      if (document.pointerLockElement === el.gl) { state = "list"; document.exitPointerLock(); }
      state = "list"; tween = null; keys.clear(); resetJoy(); setTarget(null); hud(); stop();
    },
    enterFromList() { state = entered ? "pause" : "start"; resize(); showPanel(entered ? "pause" : "start"); shadowDirty = 3; run(); requestEnter(); },
  };
}
</script>
</body>
</html>
