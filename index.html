<!doctype html>
<html lang="en" class="mode-room">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrick Sliz</title>
<meta name="description" content="Personal site of Patrick Sliz.">
<meta name="theme-color" content="#e6e6e1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141414'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%237fa6ec'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js">
<style>
  :root {
    --paper: #e6e6e1;
    --plate: #f3f3ef;
    --ink: #141414;
    --steel: #66665f;
    --hair: #b9b9b2;
    --given: #d6d6cf;
    --signal: #1f3f86;
    --signal-hi: #7fa6ec;   /* the accent on dark surfaces */
    --on-signal: #f3f3ef;   /* text on the accent */
    --error: #c62828;       /* failures only */
    --f-sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sl: env(safe-area-inset-left, 0px);
    --sr: env(safe-area-inset-right, 0px);
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  * { box-sizing: border-box; border-radius: 0; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- room mode ---------- */
  html.mode-room, html.mode-room body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  html.mode-list #room { display: none; }
  #room { position: fixed; inset: 0; height: 100vh; height: 100dvh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .mono { font: 500 12px/1.4 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; }

  #crosshair { position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--ink); outline: 1px solid var(--plate); }
  #crosshair::before { left: 7px; top: 0; width: 1px; height: 15px; }
  #crosshair::after { left: 0; top: 7px; width: 15px; height: 1px; }
  #crosshair.on::before, #crosshair.on::after { background: var(--signal-hi); outline-color: var(--ink); }

  #tag { z-index: 4; position: absolute; left: 50%; bottom: calc(74px + var(--sb)); transform: translateX(-50%); display: flex; align-items: stretch; border: 2px solid var(--ink); background: var(--plate); white-space: nowrap; }
  #tag span { padding: 8px 10px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  #tag input { width: 74px; border: 0; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); background: var(--paper); color: var(--ink); text-align: center; text-transform: uppercase; font: 700 16px var(--f-mono); letter-spacing: 0.2em; padding: 0; border-radius: 0; outline: none; }
  #tag button { appearance: none; border: 0; background: var(--ink); color: var(--plate); padding: 8px 12px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .touch #tag { bottom: auto; top: calc(100px + var(--st)); }
  #prompt { position: absolute; left: 50%; top: calc(50% + 84px); transform: translateX(-50%); display: flex; border: 2px solid var(--ink); background: var(--plate); pointer-events: none; white-space: nowrap; }
  #prompt span { padding: 6px 10px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  #prompt .key { background: var(--ink); color: var(--plate); }

  #toast { position: absolute; left: 50%; bottom: calc(26px + var(--sb)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--ink); color: var(--plate); padding: 9px 14px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: center; pointer-events: none; opacity: 0; transition: opacity 160ms ease-out; }
  #toast.on { opacity: 1; }
  .touch #toast { bottom: auto; top: calc(56px + var(--st)); }

  #inv { position: absolute; top: calc(12px + var(--st)); left: calc(12px + var(--sl)); display: flex; gap: 6px; pointer-events: none; }
  #inv span { border: 2px solid var(--ink); background: var(--plate); padding: 6px 10px; font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #inv #inv-key { background: var(--ink); color: var(--plate); }
  #inv #inv-waffle, #inv #inv-coffee { background: var(--signal); color: var(--on-signal); }

  .chip { position: absolute; top: calc(12px + var(--st)); right: calc(12px + var(--sr)); appearance: none; border: 2px solid var(--ink); background: var(--plate); padding: 6px 10px; font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; touch-action: manipulation; }
  .chip:hover { background: var(--ink); color: var(--plate); }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

  /* touch controls */
  #fly-help { position: absolute; left: calc(12px + var(--sl)); top: calc(52px + var(--st)); border: 2px solid var(--ink); background: var(--plate); pointer-events: none; font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  #fly-help b { display: block; background: var(--ink); color: var(--plate); padding: 6px 10px; font-weight: 700; }
  #fly-help div { display: flex; border-top: 1px solid var(--hair); }
  #fly-help div span { padding: 5px 10px; white-space: nowrap; }
  #fly-help div span:first-child { width: 132px; border-right: 1px solid var(--hair); }
  #fly-touch { position: absolute; right: calc(16px + var(--sr, 0px)); bottom: calc(26px + var(--sb)); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 196px; touch-action: none; }
  #fly-touch button { appearance: none; border: 2px solid var(--ink); background: rgba(243, 243, 239, 0.8); color: var(--ink); border-radius: 0; padding: 8px 4px; font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; touch-action: none; -webkit-user-select: none; user-select: none; }
  #fly-touch button.thr { grid-column: span 2; padding: 16px 4px; background: var(--ink); color: var(--plate); }
  .touch #fly-help .k, html:not(.touch) #fly-help .t { display: none; }
  #joy { position: absolute; left: calc(22px + var(--sl)); bottom: calc(26px + var(--sb)); width: 124px; height: 124px; border: 2px solid var(--ink); background: rgba(243, 243, 239, 0.55); touch-action: none; }
  #joy::before, #joy::after { content: ""; position: absolute; background: var(--hair); }
  #joy::before { left: 50%; top: 8px; bottom: 8px; width: 1px; }
  #joy::after { top: 50%; left: 8px; right: 8px; height: 1px; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; background: var(--ink); z-index: 1; will-change: transform; }
  #open { position: absolute; right: calc(22px + var(--sr)); bottom: calc(26px + var(--sb)); display: grid; justify-items: end; gap: 6px; }
  #open-label { background: var(--plate); border: 2px solid var(--ink); padding: 4px 8px; font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  #open-btn { appearance: none; border: 2px solid var(--ink); background: var(--signal); color: var(--on-signal); width: 124px; height: 64px; font: 800 24px/1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.04em; text-transform: uppercase; touch-action: manipulation; }
  #open-btn:active { background: var(--ink); color: var(--plate); }

  /* start / pause panel */
  #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100% - 32px)); background: var(--plate); border: 2px solid var(--ink); border-top-width: 6px; display: grid; }
  #panel h1 { margin: 0; padding: 12px 14px 10px; font: 800 40px/0.95 var(--f-sans); font-stretch: 70%; text-transform: uppercase; letter-spacing: -0.01em; border-bottom: 2px solid var(--ink); }
  #panel .go { appearance: none; border: 0; background: var(--ink); color: var(--plate); padding: 16px 14px; font: 800 22px/1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.04em; text-transform: uppercase; text-align: left; cursor: pointer; display: flex; justify-content: space-between; touch-action: manipulation; }
  #panel .go:hover { background: var(--signal); color: var(--on-signal); }
  #panel .go:focus-visible { outline-color: var(--signal-hi); }
  #panel .legend { margin: 0; padding: 10px 14px; border-top: 2px solid var(--ink); color: var(--steel); font: 500 11px/1.6 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; }
  #panel .alt { appearance: none; border: 0; border-top: 2px solid var(--ink); background: transparent; padding: 10px 14px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer; display: flex; justify-content: space-between; touch-action: manipulation; }
  #panel .alt:hover { background: var(--ink); color: var(--plate); }

  /* café: order card, shift cards and the shift game */
  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100% - 24px)); max-height: calc(100% - 16px); overflow: auto; background: var(--plate); border: 2px solid var(--ink); border-top-width: 6px; display: grid; z-index: 3; }
  .card h1 { margin: 0; padding: 10px 14px 8px; font: 800 32px/0.95 var(--f-sans); font-stretch: 70%; text-transform: uppercase; letter-spacing: -0.01em; border-bottom: 2px solid var(--ink); }
  .card .row { display: grid; grid-template-columns: 96px 1fr; border-bottom: 1px solid var(--hair); }
  .card .row > span { padding: 0 8px 0 14px; align-self: center; color: var(--steel); font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .card .seg { display: flex; border-left: 1px solid var(--hair); }
  .card .seg label { flex: 1 1 0; position: relative; cursor: pointer; min-width: 0; }
  .card .seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .card .seg b { display: block; padding: 9px 2px; text-align: center; border-right: 1px solid var(--hair); font: 700 11px/1.3 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
  .card .seg label:last-child b { border-right: 0; }
  .card .seg input:checked + b { background: var(--ink); color: var(--plate); }
  .card .seg input:checked + b::before { content: "\2713\00a0"; }
  .card .seg input:focus-visible + b { outline: 3px solid var(--signal); outline-offset: -3px; }
  .card .seg input:checked:focus-visible + b { outline-color: var(--signal-hi); }
  .card .name { margin: 0; padding: 10px 14px; min-height: 2.6em; border-bottom: 2px solid var(--ink); font: 750 19px/1.15 var(--f-sans); font-stretch: 75%; letter-spacing: 0.01em; text-transform: uppercase; }
  .card .txt { margin: 0; padding: 9px 14px; border-bottom: 1px solid var(--hair); color: var(--steel); font: 500 11px/1.6 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; }
  .card .stats { margin: 0; display: grid; grid-template-columns: 1fr auto; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .card .stats dt, .card .stats dd { margin: 0; padding: 7px 14px; border-bottom: 1px solid var(--hair); } .card .stats dt { color: var(--steel); } .card .stats dd { text-align: right; }
  .card .go { appearance: none; border: 0; background: var(--ink); color: var(--plate); padding: 14px; font: 800 22px/1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.04em; text-transform: uppercase; text-align: left; cursor: pointer; display: flex; justify-content: space-between; touch-action: manipulation; }
  .card .go:hover { background: var(--signal); color: var(--on-signal); } .card .go:focus-visible { outline-color: var(--signal-hi); outline-offset: -5px; }
  .card .alt { appearance: none; border: 0; border-top: 2px solid var(--ink); background: transparent; padding: 10px 14px; font: 700 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer; display: flex; justify-content: space-between; touch-action: manipulation; }
  .card .alt:hover { background: var(--ink); color: var(--plate); }
  .card .go + .alt { border-top: 0; }
  #shift { position: absolute; inset: 0; pointer-events: none; font: 700 10px/1.3 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  #shift-top { position: absolute; top: calc(10px + var(--st)); left: calc(10px + var(--sl)); right: calc(10px + var(--sr)); display: flex; gap: 8px; align-items: flex-start; }
  .touch #shift-top { right: calc(118px + var(--sr)); }
  #shift-hud { flex: none; display: grid; grid-template-columns: 1fr auto; min-width: 150px; border: 2px solid var(--ink); background: var(--plate); pointer-events: auto; font-variant-numeric: tabular-nums; font-size: 11px; }
  #sh-time { background: var(--ink); color: var(--plate); padding: 5px 9px 3px; font: 800 30px/1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.02em; }
  #sh-time.last { background: var(--error); }
  #sh-pause { appearance: none; border: 0; border-left: 2px solid var(--plate); background: var(--ink); color: var(--plate); padding: 0 12px; font: 700 12px var(--f-mono); cursor: pointer; }
  #sh-pause:focus-visible { outline-color: var(--signal-hi); outline-offset: -4px; }
  #sh-tips { grid-column: span 2; padding: 5px 9px 3px; font: 800 22px/1 var(--f-sans); font-stretch: 75%; }
  #sh-streak, #sh-served { grid-column: span 2; padding: 4px 9px; border-top: 1px solid var(--hair); }
  #shift-tickets { flex: 1; min-width: 0; display: flex; gap: 6px; }
  .tk { flex: 1 1 0; min-width: 0; max-width: 230px; appearance: none; display: grid; align-content: start; padding: 0; border: 2px solid var(--ink); background: #fbfbf7; color: var(--ink); text-align: left; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  .tk .who { display: flex; justify-content: space-between; gap: 6px; background: var(--ink); color: var(--plate); padding: 3px 7px; white-space: nowrap; overflow: hidden; }
  .tk .nm { padding: 5px 7px 2px; font: 750 13px/1.1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.01em; }
  .tk .cmp { display: flex; flex-wrap: wrap; gap: 0 7px; padding: 0 7px 5px; color: var(--steel); }
  .tk .cmp i { font-style: normal; } .tk .cmp i.ok { text-decoration: line-through; } .tk .cmp i.nx { color: var(--on-signal); background: var(--signal); padding: 0 4px; }
  .tk .bar { display: block; height: 7px; border-top: 2px solid var(--ink); background: var(--given); } .tk .bar b { display: block; height: 100%; background: var(--ink); transform-origin: left; }
  .tk.low { border-color: var(--error); } .tk.low .who, .tk.low .bar b { background: var(--error); } .tk.low .bar { border-color: var(--error); }
  .tk.fit { outline: 3px solid var(--signal-hi); outline-offset: 0; }
  #shift-hand { position: absolute; left: 50%; bottom: calc(26px + var(--sb)); transform: translateX(-50%); max-width: calc(100% - 24px); display: flex; border: 2px solid var(--ink); background: var(--plate); font-size: 11px; white-space: nowrap; }
  #shift-hand u { text-decoration: none; background: var(--ink); color: var(--plate); padding: 6px 9px; } #shift-hand span { padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; }
  #shift-hand.bad { border-color: var(--error); } #shift-hand.bad u { background: var(--error); color: #fff; }
  .touch #shift-hand { bottom: calc(12px + var(--sb)); }
  .ctag { position: absolute; transform: translate(-50%, -100%); border: 2px solid var(--ink); background: var(--plate); padding: 3px 7px; font-size: 11px; white-space: nowrap; }
  .ctag.go { background: var(--signal); color: var(--on-signal); border-color: var(--signal); } .ctag.low { border-color: var(--error); }
  #shift-flash { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: var(--error); color: #fff; padding: 8px 14px; font: 800 26px/1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.04em; }
  .pop { position: absolute; transform: translate(-50%, -50%); background: var(--ink); color: var(--plate); padding: 3px 6px; white-space: nowrap; font: 800 18px/1 var(--f-sans); font-stretch: 75%; letter-spacing: 0.02em; animation: pop 1s ease-out forwards; }
  .pop.bad { background: var(--error); color: #fff; }
  @keyframes pop { from { opacity: 1; margin-top: 0; } 70% { opacity: 1; } to { opacity: 0; margin-top: -44px; } }
  #room.shift #toast { bottom: auto; top: calc(132px + var(--st)); }
  @media (max-height: 460px) { .card { width: min(560px, calc(100% - 24px)); } .card h1 { font-size: 22px; padding: 7px 14px 5px; } .card .seg b { padding: 6px 2px; } .card .name { padding: 6px 14px; min-height: 0; font-size: 16px; } .card .txt { padding: 5px 14px; line-height: 1.45; } .card .go { padding: 10px 14px; font-size: 19px; } .card .alt { padding: 7px 14px; } .card .stats { grid-template-columns: 1fr auto 1fr auto; } .card .stats dt, .card .stats dd { padding: 4px 14px; }
    #sh-time { font-size: 22px; } #sh-tips { font-size: 17px; } #sh-streak, #sh-served { padding: 2px 9px; } .tk .nm { font-size: 12px; } #room.shift #toast { top: calc(104px + var(--st)); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

  #loader { position: absolute; inset: 0; background: var(--paper); display: grid; place-content: center; gap: 8px; font: 700 13px/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; z-index: 5; }
  #loader .bar { width: 180px; height: 6px; border: 1px solid var(--ink); }
  #loader .bar i { display: block; height: 100%; width: 0; background: var(--ink); }
  #pct { font-weight: 700; font-variant-numeric: tabular-nums; }

  #fade { position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; transition: opacity 240ms ease-out; z-index: 6; }
  #fade.on { opacity: 1; }

  /* ---------- list view ---------- */
  #list { max-width: 520px; margin: 0 auto; padding-block: 20px 36px; padding-left: max(16px, var(--sl)); padding-right: max(16px, var(--sr)); display: flex; flex-direction: column; gap: 16px; }
  #list .mast { border-top: 6px solid var(--ink); border-bottom: 2px solid var(--ink); padding-block: 8px 10px; display: grid; grid-template-columns: 1fr auto; align-items: end; }
  #list .mast h1 { margin: 0; font: 800 34px/0.95 var(--f-sans); font-stretch: 70%; text-transform: uppercase; letter-spacing: -0.01em; }
  #list .mast span { font: 500 12px/1.4 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; }
  #rows { list-style: none; margin: 0; padding: 0; border: 2px solid var(--ink); background: var(--plate); }
  #rows li + li { border-top: 2px solid var(--ink); }
  #rows a { display: grid; grid-template-columns: 34px 1fr auto 18px; align-items: baseline; gap: 8px; padding: 12px; text-decoration: none; }
  #rows a:hover, #rows a:focus-visible { background: var(--ink); color: var(--plate); outline: none; }
  #rows .no { font: 500 12px var(--f-mono); color: var(--steel); }
  #rows .nm { font: 750 20px/1.1 var(--f-sans); font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.01em; }
  #rows .to { font: 500 11px var(--f-mono); color: var(--steel); overflow-wrap: anywhere; text-align: right; }
  #rows .ar { font: 700 14px var(--f-mono); text-align: right; }
  #rows a:hover .no, #rows a:hover .to, #rows a:focus-visible .no, #rows a:focus-visible .to { color: var(--hair); }
  #list .enter { appearance: none; border: 2px solid var(--ink); background: var(--plate); padding: 11px 12px; font: 700 13px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: left; cursor: pointer; display: flex; justify-content: space-between; }
  #list .enter:hover { background: var(--ink); color: var(--plate); }
  #list .note { margin: 0; font: 500 11.5px/1.5 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--steel); }
  noscript p { max-width: 520px; margin: 24px auto; padding: 0 16px; font: 500 13px/1.6 var(--f-mono); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="room">
  <canvas id="gl" tabindex="-1" aria-label="3D room. Use List view for a plain list of links."></canvas>
  <div id="crosshair" hidden></div>
  <div id="prompt" hidden><span id="prompt-label"></span><span class="key" id="prompt-key">E / CLICK</span></div>
  <div id="joy" hidden><div id="joy-knob"></div></div>
  <div id="tag" hidden><span>Initials</span><input id="tag-in" maxlength="3" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Initials for the scoreboard"><button id="tag-post" type="button">Post</button></div>
  <div id="open" hidden><span id="open-label"></span><button id="open-btn" type="button">Open</button></div>
  <div id="toast" role="status" aria-live="polite"></div>

      if (TOUCH || !CAN_LOCK) { state = "play"; hud(); } else { state = "pause"; showPanel("pause"); }
      run(); return true;
    },
    leave() { // going to the list view
      if (document.pointerLockElement === el.gl) { state = "list"; document.exitPointerLock(); }
      state = "list"; tween = null; keys.clear(); resetJoy(); setTarget(null); hud(); stop();
    },
    enterFromList() { state = entered ? "pause" : "start"; resize(); showPanel(entered ? "pause" : "start"); shadowDirty = 3; run(); requestEnter(); },
  };
}
</script>
</body>
</html>
